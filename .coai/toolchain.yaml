# The checks coai runs on a coder job's worktree in this repository (server.md § 12; shared/toolchain.schema.json).
# A coder job reads THIS file at its BASE commit, so a change to it takes effect for the jobs after it, not for the job that made it.
# Block lists only: the strict YAML subset has no flow list but []. Every argv runs from the repository root, with no shell.
# instructions: not declared. AGENTS.md of this repository orders the rule resolver before any edit, but the resolver's payload for the files of a task is about 334 KB (33 rules; the resolver itself refuses to print more than 32 KiB in one read) and a step may print at most 64 KiB, so
# the step is NOT declared with a cut text (epoch 3 E3 s7 t3 d5). Until the lead decides, a coder of this repository is told that nothing was run.
version: 1
projects:
  - path: src_mcp
    adapter: dotnet
    # Build the whole solution: the MCP server is the thing under test, and its test executable is built with it.
    build:
      - dotnet
      - build
      - dew_flow_connect_other_ais.slnx
      - -c
      - Debug
      - "-m:{jobs}"
    # The MTP executable, never `dotnet test`: there is no VSTest host here and it aborts (.agents/conventions/common/testing.md).
    test:
      - ./src_mcp/tests/bin/Debug/net10.0/CoaiMcp.Tests
    memoryMb: 3000
    # The tests of a changed file run first (epoch 3 E4 s5 t6): a folder prefix of testFiles is relative to the project, so "tests" is src_mcp/tests.
    # {stem} is an item of its own and becomes one item per changed file (a test file A<Name>Tests.cs holds the class CoaiMcp.Tests.A<Name>Tests); the script turns each stem into one --filter-class.
    # A test command with no match exits 8 ("no test ran"): the full command then runs. The full command never runs after a red selected run.
    # src_vs_code is NOT a project of this file: its tests need a compile step and its scenarios need a VS Code host, so no command here could run them in a check unit.
    testFor:
      - /bin/sh
      - -c
      - 'x=./src_mcp/tests/bin/Debug/net10.0/CoaiMcp.Tests; for s in "$@"; do x="$x --filter-class CoaiMcp.Tests.$s"; done; exec $x'
      - sel
      - "{stem}"
    testFiles:
      - tests
