# coai v2 work contract (draft schema; validated by validate_work from epoch 1 E3)
id: e1-gate-simplify
title: "Gate simplification, renames, migration, conventions out"
mvp: true
half: server
dependsOn: []
parallelWith:
  - e2-thin-shell
doneWhen:
