title: "Real codex coder job and real agy coder job with the smallest model of each: a planted red check, one fix turn in the session of turn 0, green"
kind: measure
complexity: 5
dependsOn:
  - t2-read-only-paid-proof
parallel: false
security: true
files:
  - v2/epoch-3/e3-roles-complete/RESULTS_roles_proof.md
dod:
  - id: d1
    item: "for each vendor the judgement shipped: one real coder job with the smallest model of that vendor on a fixture repository with its own toolchain file and a planted red check; the file holds the job id, the session id of turn 0 and of the fix turn (equal, read from the own stream of the CLI), fixTurns, green, the properties of the unit and the spend"
