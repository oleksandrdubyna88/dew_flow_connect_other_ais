title: "Epic acceptance on the real binary over stdio with FakeCli: scout, judge, a codex coder and an agy coder resumed, a plan round over a folder"
kind: test
complexity: 6
dependsOn: []
parallel: false
files:
  - src_mcp/tests/TheRolesCompleteEpicAcceptanceTests.cs
