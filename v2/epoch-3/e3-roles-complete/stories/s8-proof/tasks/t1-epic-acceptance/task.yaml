dod:
  - id: d1
    item: "on a real coai-mcp over stdio with the real detached runner and FakeCli as every CLI: a scout job and a judge job end succeeded with their strict JSON envelopes; a coder job routed to codex and one routed to agy each go red, then green after one fix turn, and the recorded argv shows the session of turn 0 resumed (exec resume, --conversation)"
