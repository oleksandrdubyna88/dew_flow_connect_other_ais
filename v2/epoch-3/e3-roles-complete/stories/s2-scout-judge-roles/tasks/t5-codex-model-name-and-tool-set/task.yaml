  - src_mcp/tests/fixtures/codex-tool-reports/gpt-6.1-terra.json
  - src_mcp/tests/fixtures/codex-tool-reports/gpt-5.6-terra.json
  - src_mcp/tests/ACodexModelNameIsResolvedAtJobStartTests.cs
  - src_mcp/tests/ACodexModelListTests.cs
  - src_mcp/tests/ACodexCoderPreflightTests.cs
