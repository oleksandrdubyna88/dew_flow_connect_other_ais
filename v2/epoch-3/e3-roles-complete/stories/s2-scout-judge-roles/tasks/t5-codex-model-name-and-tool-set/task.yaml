# coai v2 work contract (draft schema; validated by validate_work from epoch 1 E3)
id: t5-codex-model-name-and-tool-set
title: "The owner's decisions of 2026-11-27 (ledger entries 2.1 and 2.2), as the re-review left them (SPEC_CHANGES section S, S4: the rule as it stands; section T: the plan round and the lead's review): a codex name with no version (terra, astra, sol, luna) is a family and becomes the newest gpt-<version>-<family> that the installed CLI lists when the job reaches the entry; before the first launch of an entry a model that cannot be used, a tool list that cannot be read and a tool outside the known set end the entry model-unavailable and the job fails over; the tool list passes with fewer tools only when the inventory was read whole; after the first launch of an entry every boundary stop is terminal (placed in s2: s5, s7 and s8 are at the limit of 6 tasks; it changes what s5 t3 and s7 t4 built)"
kind: security
complexity: 6
dependsOn: []
parallel: false
security: true
files:
  - shared/role-model-names.json
  - shared/coder-boundary-releases.json
  - src_mcp/core/Roles/RoleModelNames.cs
  - src_mcp/core/Roles/CodexModelShape.cs
  - src_mcp/core/Notices/ServerNoticeCodes.cs
  - src_mcp/runners/Consultation/CodexModelList.cs
  - src_mcp/runners/Consultation/CodexToolList.cs
  - src_mcp/runners/Consultation/CodexPreflightRows.cs
  - src_mcp/runners/Consultation/CodexCoderVendor.cs
  - src_mcp/runners/Toolchain/CoderBoundary.cs
  - src_mcp/src/Server/RoleJobs/CodexEntryModel.cs
  - src_mcp/src/Server/RoleJobs/RoleModelLauncher.cs
  - src_mcp/src/Server/RoleJobs/RoleStops.cs
  - src_mcp/src/Server/RoleJobs/RoleFailover.cs
  - src_mcp/src/Server/RoleJobs/RoleJobNotices.cs
