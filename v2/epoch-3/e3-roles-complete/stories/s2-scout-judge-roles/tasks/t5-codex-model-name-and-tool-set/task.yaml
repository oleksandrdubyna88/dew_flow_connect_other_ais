  - v2/epoch-3/e3-roles-complete/RESULTS_e3_codex_model_name.md
dod:
  - id: d1
    item: "red first, on a named base: the tests of d2 to d6 are written before the product code and are run on the code of commit 62c6878c (the plan stop; the code there has the exact list of 11 names and no family rule); the task result names that red run and the green run of the whole MCP suite, both through the MTP executable. RED on that base, each for its own reason: the argv holds -m terra; gpt-6.3-terra is refused route-invalid; a tool list of 9 of the 11 known names is refused; a tool list that cannot be read ends the job coder-boundary where no boundary broke; a tool outside the known set ends the job and the next entry is not launched; no notice coder-tool-unknown is written; the recorded report of gpt-5.6-terra is not admitted. GREEN on that base, so each is a GUARD and the task result names, for each, the mutation of the new code that turns it red: an inventory in another form is not admitted (mutation: any list that is not empty and holds no outside name passes); two reads that differ end the job coder-boundary (mutation: the two reads are not compared); an item type of the stream that nobody measured ends the job with zero launches of the next entry (mutation: a boundary stop of a turn is mapped to model-unavailable); a new tool on a fix turn ends the job (mutation: the mapping of the first launch is used for every launch); a claude id is never accepted by its shape (mutation: the shape rule is asked for every vendor); the important list is compared by the written name (mutation: the name is resolved before the list is compared); no text of a tool name that has the shape of a secret reaches a sentence (mutation: the redactor is not asked)"
  - id: d2
    item: "V30, the name (SPEC_CHANGES Q1; S4 items 1 to 3 and 13): the families are data, a list families in the codex part of shared/role-model-names.json (terra, astra, sol, luna); when a job reaches a codex entry whose name is a family, coai reads the live list of the CLI itself (codex debug models, without --bundled; a network call and no model call) with the same home and environment as the launch that follows, with a deadline and a size limit; for a coder the run is a unit with the property list of the launch and the job's own CODEX_HOME, never the real home, and its working folder holds NO text of the repository — the stand-in project or an empty folder of the job, never the worktree (a test reads the working folder of the unit and finds no AGENTS.md and no .codex of the fixture repository in it); a candidate is a name of the exact shape gpt-<version>-<family> with visibility list; a number of the version has no leading zero; versions are compared number by number, a missing number is 0 (7 over 6.2, 6.10 over 6.9, 6.1 over 6), and of two equal versions the one listed first; a hidden name and a name with other words (gpt-terra-latest, gpt-6.1-terra-preview) are never taken by the family rule, so the text after -m always has the shape; a name given in full is used as given and is never replaced by a newer one; the resolved name is written into the job's record once, and every later turn of the session (a fix turn, a repair turn, exec resume) uses the recorded name and never resolves again; a route whose first model answers makes no codex call; the rule holds for every codex entry of every role (coder, scout, important, ba, orchestrator, the bands); the envelope, the job's record and the line of a model switch name the name as asked and the name as resolved, and the usage line names the resolved name"
  - id: d3
    item: "V31, a resolved name needs no hand edit (SPEC_CHANGES Q1, the rule of the file; S4 items 4 and 6): before a folder is made a codex name is accepted when it is in names, or is a family, or has the exact shape gpt-<version>-<family> with a family of the list; gpt-6.3-terra and gpt-7-astra pass with no edit of the file; gpt-6.3-tera, gpt-x-terra, GPT-6.1-terra, gpt-6.1-terra-preview, gpt-06-terra, gpt-6.01-terra and a name with a space end route-invalid before any folder, and the sentence names the setting; the key measured stays history and gates nothing; the claude rule does NOT change — a test holds that a claude id is never accepted by its shape — and the agy list does not change; a resolution never changes the route: the important list and every other list are compared by the written name before a folder is made, as today, so with important = astra a caller that names gpt-6.2-astra is refused and the sentence says to name the family or to change the list (a test); the comment of the file says the new rule, why it is right for codex only, and that a new name scheme of the vendor needs one edit of the file (Q4)"
  - id: d4
    item: "V32, the stop word model-unavailable (SPEC_CHANGES Q2; S4 items 7, 12 and 13), a new word of attempts[].stop that fails over at once like limit, refusal and crash, and that exists ONLY before the first launch of an entry. The cases: a family with no model in the list, and a full name of the exact shape that the list does not hold (the sentence names the setting when a person gave the name) — the other models of the vendor are still tried; a full name of the shape that the list holds with visibility hide is ALLOWED and launched as given (a test: only the family rule reads visibility); a full name of names with no family (gpt-5.5, gpt-5.4) is NOT looked up — the CLI's own refusal and its existing classification answer it, and a test holds that no list read is made for it; a list that cannot be read (an exit that is not 0, the deadline, not the expected JSON, over the size limit) — the other models of the vendor are skipped; a tool list that cannot be read and a tool outside the known set (d5) — the other models of the vendor are still tried. The run that reads the list is read by the classifier of a launch first, so a missing CLI, a lost sign-in and a spent quota keep their own words and sentences; and during the list read a unit that is refused, a write that the OS layer stopped, and a unit that does not stop are coder-boundary and end the job, never model-unavailable (a test for each of the three). On the last entry the job ends failed with the word and does not wait. FakeCli counts zero launches of the model and the usage ledger has no line for the entry; with a route codex terra then agy and a codex list that holds no terra, the agy entry is launched. AFTER the first launch of an entry every boundary stop is terminal — coder-boundary, nothing of that turn committed, no failover — each held by a test that finds zero launches of the next entry: a red preflight of a repair turn, of a fix turn and of a resumed session, whatever row is red; an item type of the stream that nobody measured; a web_search item; a collab_tool_call item; the rollout check"
  - id: d5
    item: "V33 and V36, the tool list (SPEC_CHANGES Q3; S4 items 8 to 10 and 12; it replaces the exact list of s5 t3 d3): the row tool-list holds when the inventory was read WHOLE and no name of it is outside the known set of 11, so 11 names, 9 names and 1 name pass, and the envelope names the known tools that the model does not have; a read is whole when the report is the expected JSON, every tool entry has a name, a tool that holds tools is walked, and, when functions.exec is in the list, EVERY line of its description that starts with ### matches the grammar ^### `[A-Za-z0-9_.-]+`$ and there is at least one such line; one ### line of another form makes the read not whole; a read that is not whole, a report that cannot be read and a list with no name pass nothing — in both reads with every other row holding it is model-unavailable (d4), in one read only it is coder-boundary, and with another row red the boundary row wins. Two tests of the grammar: the recorded report with the nested inventory in another form in both copies does NOT hold, where the code before this item admitted a list of 4 known names; and the recorded reports of gpt-6.1-terra and of gpt-5.6-terra (fixtures of this task, recorded with no model call, d8) ARE read whole — if one of them is not, the task stops and says so, and the grammar is not widened in silence. A name outside the set (collaboration.spawn_agent, a name that starts with mcp__, a new name) refuses the launch of THIS model: the row tool-list is red, and — the owner, 2026-11-27, ledger entry 2.2: move to the next model — at the FIRST launch of an entry, when the names are the same in both reads and every other row holds, the entry ends model-unavailable and the job goes to the next entry, with zero launches of the refused model counted by FakeCli; with a route codex terra, codex astra, agy, where both codex lists hold the outside name, both entries are refused, each has its notice (d6), and the agy entry is launched; on the last entry the job ends failed with model-unavailable. The list of the worktree and the list of the stand-in project with its own MCP config must hold the same names, and a project that adds OR removes a tool is refused coder-boundary on the row no-project-tools. A new tool that shows on a fix turn (it was not there at turn 0) ends the job coder-boundary with zero launches of the next entry. The mapping from a red tool row to the stop word is in ONE place of the code, and that place takes the number of the launch. No measured tool is kept required, because none is a guard (the table of Q3)"
  - id: d6
    item: "V34, the person is told (S4 items 8 and 11): the sentence of the attempt, the envelope and one notice coder-tool-unknown for each entry that is refused for its tool list, with one of two reasons — a tool outside the known set, or an inventory that was not read whole (then no name is shown) — and with the job, the vendor, the name as asked and as resolved, and the installed CLI version; a name of a tool is shown only when BOTH hold: it is 1 to 64 characters of letters, digits, underscore, dot and hyphen, AND the shared secret redactor leaves it exactly as it is (finding F0 of the plan round of the re-review); any other name is said as a name that cannot be shown, with its length; at most 5 names are shown, then the count; this is the one exception to s5 t3 d4 (a row never carries the output of a program it ran); a test plays a name with a line break, with a control character, with 300 characters, and a secret-shaped name made ONLY of allowed characters (a fixture of the redactor's own tests), and finds none of them in the sentence, the envelope, the notice or a log line"
  - id: d7
    item: "the tests of s5 t3 that held the exact 11 names are changed to the new rule in the same commit and none is deleted: the test that holds the pre ids of the table and the rows equal still passes, and each of the two rows still goes red through the test seam when its property is dropped (a name added to the list, a stand-in list that differs); FakeCli plays the model list and the tool reports from recordings of the real commands (d8), scrubbed, and no phrase is matched that no fixture shows"
  - id: d8
    item: "V35, one real preflight with 0 model calls, through the harness of TheRealCodexCoderRunTests (the preflight phase only), on the installed codex, in the real unit: with the default name terra the job's name resolves to the newest gpt-<version>-terra of the live list of that day, the admission is Admitted and every row holds; with the full name gpt-5.6-terra the name is used as given, the job is admitted with fewer tools, and the result names the known tools it does not have; with the family astra the resolved name and the answer of every row are recorded; the tool reports of gpt-6.1-terra and of gpt-5.6-terra (codex debug prompt-input with the flags of the launch, no model call) are saved as the two fixtures of d5, scrubbed; the working folder and the wall time of the list read are recorded; 0 paid calls, so the codex budget stays 25 of 30; the sha256 of the real auth.json of codex is equal before and after; if the live list cannot be read with the job's own sign-in copy, the task stops and says so — it does not read the list with the real home or with a full copy; the results are a new file RESULTS_e3_codex_model_name.md beside the SPEC, and no earlier results file is changed"
  - id: d9
    item: "the gate of the judgement (S2 point 3; section T, the lead's items 2 and 7): the commit that changes the rows tool-list and no-project-tools lands ONLY when addendum 4 of the judgement is in v2/spikes/RESULTS_codex_agy_write_boundary_judgement.md with the verdict ship. This task does not write the addendum: it is a judge job of its own, on the important list, which the lead orders and commits unchanged. It rules on CX-T1 as a known set with the whole-inventory rule (d5), on the failover before the first launch for a tool outside the set (d5, ledger entry 2.2), on the terminal rule after the first launch (d4), on the run that reads the list of models (d2, d4) and on risk 14, which the owner accepted on 2026-11-27; it replaces, for a smaller list only, the sentence of its section 13.3 that a list that differs is a measure to order. This task writes the verdict and the date into the history of the codex row of shared/coder-boundary-releases.json by the rule of SPEC section C2 (how the history grows), and the commit of the rows names the commit of the addendum. A verdict other than ship stops this task and goes to the owner"
