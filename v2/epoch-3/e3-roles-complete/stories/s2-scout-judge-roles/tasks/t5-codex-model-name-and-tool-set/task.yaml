# coai v2 work contract (draft schema; validated by validate_work from epoch 1 E3)
id: t5-codex-model-name-and-tool-set
title: "The owner's decision of 2026-11-27 (ledger entry 2.1; SPEC_CHANGES section Q): a codex name with no version (terra, astra, sol, luna) is a family and becomes the newest gpt-<version>-<family> that the installed CLI lists when the job reaches the entry; a name that cannot be used ends the entry model-unavailable and fails over; the tool list of a codex coder passes when it holds no tool outside the known set, and a tool outside the set ends the entry model-unavailable and fails over too (ledger entry 2.2, SPEC_CHANGES section R) (placed in s2: s5, s7 and s8 are at the limit of 6 tasks; it changes what s5 t3 and s7 t4 built)"
kind: security
complexity: 6
dependsOn: []
parallel: false
security: true
files:
  - shared/role-model-names.json
  - src_mcp/core/Roles/RoleModelNames.cs
  - src_mcp/core/Notices/ServerNoticeCodes.cs
  - src_mcp/runners/Consultation/CodexModelList.cs
  - src_mcp/runners/Consultation/CodexToolList.cs
  - src_mcp/runners/Consultation/CodexPreflightRows.cs
  - src_mcp/runners/Consultation/CodexCoderVendor.cs
  - src_mcp/src/Server/RoleJobs/RoleStops.cs
  - src_mcp/src/Server/RoleJobs/RoleFailover.cs
  - src_mcp/tests_fakecli/CodexVerbs.cs
  - src_mcp/tests/fixtures/role-stops/codex-debug-models.json
  - src_mcp/tests/ACodexModelNameIsResolvedAtJobStartTests.cs
  - src_mcp/tests/ACodexCoderPreflightTests.cs
  - src_mcp/tests/TheRealCodexCoderRunTests.cs
  - v2/epoch-3/e3-roles-complete/RESULTS_e3_codex_model_name.md
dod:
  - id: d1
    item: "red first: the tests of d2 to d6 are written before the product code and are seen red on the code as it is, each for its own reason (the argv holds -m terra; gpt-6.3-terra is refused route-invalid; a tool list of 9 of the 11 known names is refused; a refused job says coder-boundary where no boundary broke); the task result names the red run and the green run of the whole MCP suite, through the MTP executable"
  - id: d2
    item: "V30, the name (SPEC_CHANGES Q1): the families are data, a list families in the codex part of shared/role-model-names.json (terra, astra, sol, luna); when a job reaches a codex entry whose name is a family, coai reads the live list of the CLI itself (codex debug models, without --bundled; a network call and no model call) with the same home and environment as the launch that follows — for a coder in a unit with the property list of the launch and the job's own CODEX_HOME, never the real home — with a deadline and a size limit; a candidate is a name of the exact shape gpt-<version>-<family> with visibility list; versions are compared number by number, a missing number is 0 (7 over 6.2, 6.10 over 6.9, 6.1 over 6), and of two equal versions the one listed first; a hidden name and a name with other words (gpt-terra-latest, gpt-6.1-terra-preview) are never taken, so the text after -m always has the shape; a name given in full is used as given and is never replaced by a newer one; the resolved name is written into the job's record once, and every later turn of the session (a fix turn, a repair turn, exec resume) uses the recorded name and never resolves again; a route whose first model answers makes no codex call; the rule holds for every codex entry of every role (coder, scout, important, ba, orchestrator, the bands); the envelope, the job's record and the line of a model switch name the name as asked and the name as resolved, and the usage line names the resolved name"
  - id: d3
    item: "V31, a resolved name needs no hand edit (SPEC_CHANGES Q1, the rule of the file): before a folder is made a codex name is accepted when it is in names, or is a family, or has the exact shape gpt-<version>-<family> with a family of the list; gpt-6.3-terra and gpt-7-astra pass with no edit of the file; gpt-6.3-tera, gpt-x-terra, GPT-6.1-terra, gpt-6.1-terra-preview and a name with a space end route-invalid before any folder, and the sentence names the setting; the key measured stays history and gates nothing; the claude rule does NOT change — a test holds that a claude id is never accepted by its shape — and the agy list does not change; the comment of the file says the new rule and why it is right for codex only"
  - id: d4
    item: "V32, the stop word model-unavailable (SPEC_CHANGES Q2), a new word of attempts[].stop that fails over at once like limit, refusal and crash: a family with no model in the list, and a full name of the shape that the list does not hold (the sentence names the setting when a person gave the name) — the other models of the vendor are still tried; a list that cannot be read (an exit that is not 0, the deadline, not the expected JSON, over the size limit) — the other models of the vendor are skipped; since ledger entry 2.2 also a tool outside the known set (d5) — the other models of the vendor are still tried; the run that reads the list is read by the classifier of a launch first, so a missing CLI, a lost sign-in and a spent quota keep their own words and sentences; on the last entry the job ends failed with the word and does not wait; for these cases the word is never coder-boundary and never route-invalid; FakeCli counts zero launches of the model and the usage ledger has no line for the entry; with a route codex terra then agy and a codex list that holds no terra, the agy entry is launched"
  - id: d5
    item: "V33, the tool list (SPEC_CHANGES Q3; it replaces the exact list of s5 t3 d3): the row tool-list holds when no name of the list is outside the known set of 11, so 11 names, 9 names and 1 name pass, and the envelope names the known tools that the model does not have; a name outside the set (collaboration.spawn_agent, a name that starts with mcp__, a new name) refuses the launch of THIS model: the row tool-list is red, and — the owner, 2026-11-27, ledger entry 2.2: move to the next model; it replaces the coder-boundary that entry 2.1 wrote here — when the names are the same in both reads and every other row holds, the entry ends model-unavailable and the job goes to the next entry, with zero launches of the refused model counted by FakeCli; with a route codex terra, codex astra, agy, where both codex lists hold the outside name, both entries are refused, each has its notice (d6), and the agy entry is launched; on the last entry the job ends failed with model-unavailable; with another row red too the job ends coder-boundary; the mapping from a red tool row to the stop word is in ONE place of the code; the list of the worktree and the list of the stand-in project with its own MCP config must hold the same names, and a project that adds OR removes a tool is refused coder-boundary on the row no-project-tools; a list that cannot be read or that holds no name passes nothing — in both reads with every other row holding it is model-unavailable (d4), in one read only it is coder-boundary, and with another row red the boundary row wins; no measured tool is kept required, because none is a guard (the table of Q3)"
  - id: d6
    item: "V34, the person is told the name of the tool: the sentence of the attempt, the envelope and one notice coder-tool-unknown for each entry that is refused this way (the job, the vendor, the name as asked and as resolved, the installed CLI version, the names); a name is shown only when it is 1 to 64 characters of letters, digits, underscore, dot and hyphen, any other name is said as a name that cannot be shown, with its length; at most 5 names are shown, then the count; this is the one exception to s5 t3 d4 (a row never carries the output of a program it ran), and a test plays a name with a line break, with a control character, with a secret-shaped text and with 300 characters and finds none of them in the sentence, the envelope, the notice or a log line"
  - id: d7
    item: "the tests of s5 t3 that held the exact 11 names are changed to the new rule in the same commit and none is deleted: the test that holds the pre ids of the table and the rows equal still passes, and each of the two rows still goes red through the test seam when its property is dropped (a name added to the list, a stand-in list that differs); FakeCli plays the model list from a recording of the real command (d8), scrubbed, and no phrase is matched that no fixture shows"
  - id: d8
    item: "V35, one real preflight with 0 model calls, through the harness of TheRealCodexCoderRunTests (the preflight phase only), on the installed codex, in the real unit: with the default name terra the job's name resolves to the newest gpt-<version>-terra of the live list of that day, the admission is Admitted and every row holds; with the full name gpt-5.6-terra the name is used as given, the job is admitted with fewer tools, and the result names the known tools it does not have; with the family astra the resolved name and the answer of every row are recorded; the wall time of the list read is recorded; 0 paid calls, so the codex budget stays 25 of 30; the sha256 of the real auth.json of codex is equal before and after; if the live list cannot be read with the job's own sign-in copy, the task stops and says so — it does not read the list with the real home or with a full copy; the results are a new file RESULTS_e3_codex_model_name.md beside the SPEC, and no earlier results file is changed"
  - id: d9
    item: "the docs say what was built, after s8 t5 has landed its own change of the same files: v2/architecture/server.md section 20 and the module document of the runners name the family rule, the word model-unavailable with its failover, the tool rule and the notice coder-tool-unknown; the tab that shows the notice is not built here (epoch 4 e4-local-pages)"
