name: deploy the ingest server

# Updates `bugs.remsoft.dev` to a published `bugs-v*` release.
#
# ---------------------------------------------------------------------------
# A FILE OF ITS OWN, and its own secrets, by operator decision: the bugs server is a fully
# independent deployment. It shares no key, no environment and no script with `deploy-server.yml`
# — so a mistake in one cannot reach the other, and the ingest server can be redeployed without
# anybody thinking about whether a review is running on the Team server.
#
# ALL SECRETS LIVE IN ACTIONS SECRETS. Nothing here is typed on a host by hand: the SSH key, the
# host, the user, the known-hosts line and the server's own HMAC secret all come from this
# repository's secret store, which is the one place they can be rotated without a person opening a
# terminal. `deploy/bugs/README.md` lists exactly which ones and how to produce each.
#
# As with the Team server, this workflow does NOT swap symlinks, keep a trail or decide that a
# deployment is healthy — `deploy/bugs/release.sh` on the host owns all of that. This file checks
# the request, puts the PUBLISHED artefact on the host, runs that script, and then asks the edge
# whether it answers.
#
# It does NOT establish which VERSION is answering, and this comment used to say it did. `/health`
# carries no version on purpose: it is unauthenticated and faces the public internet, so a build
# banner there would tell anybody which release is running. Which release is serving is settled on
# the host, by the canary in `release.sh`, after the symlink swap and the restart — where that
# information already is.
#
# Dispatch rather than `on: release`: cutting a release and choosing to interrupt a live service
# are the same person's decisions, but they are not the same decision.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The published coai-bugs version to deploy, e.g. 0.1.0'
        required: true
        type: string

concurrency:
  group: coai-bugs-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOST_RID: linux-x64

jobs:
  # OUTSIDE the production environment deliberately: a typo must not spend somebody's approval, and
  # a version whose release failed halfway must be refused before anything touches the host.
  preflight:
    name: the request is answerable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      asset: ${{ steps.check.outputs.asset }}
    steps:
      - id: check
        env:
          # Through the environment, never interpolated into the script: a `${{ }}` inside `run:` is
          # substituted before bash sees the text, so a version carrying a quote would be code.
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "'$VERSION' is not a version"; exit 1; }

          TAG="bugs-v$VERSION"
          ASSET="coai-bugs-$VERSION-${HOST_RID}.tar.gz"

          # The RELEASE must carry the archive this host runs. A `bugs-v*` tag whose matrix failed
          # leaves a draft with some of its assets, and deploying from one is how a host ends up
          # running a version that was never published.
          gh release view "$TAG" --json assets --jq '[.assets[].name]' > assets.json \
            || { echo "no release $TAG"; exit 1; }
          grep -q "\"$ASSET\"" assets.json \
            || { echo "$TAG carries no $ASSET — the release is incomplete"; cat assets.json; exit 1; }

          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

  deploy:
    name: put it on the host
    needs: [preflight]
    runs-on: ubuntu-latest
    # Its OWN environment, not the Team server's `production`: a fully independent deployment
    # means an independent set of secrets and an independent approval. The key that can update
    # this service must not be reachable from a workflow that deploys the other one.
    environment: production_bugs
    timeout-minutes: 20
    steps:
      - name: The key, for this run only
        env:
          BUGS_DEPLOY_KEY: ${{ secrets.BUGS_DEPLOY_KEY }}
          BUGS_DEPLOY_KNOWN_HOSTS: ${{ secrets.BUGS_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required in BUGS_DEPLOY_KEY BUGS_DEPLOY_KNOWN_HOSTS; do
            [[ -n "${!required:-}" ]] || { echo "$required is not set in this repository's secrets"; exit 1; }
          done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$BUGS_DEPLOY_KEY" > ~/.ssh/id_bugs
          chmod 600 ~/.ssh/id_bugs
          # PINNED, never `StrictHostKeyChecking=no`: a deploy that accepts any key is a deploy that
          # can be pointed at somebody else's machine, carrying this repository's secret with it.
          printf '%s\n' "$BUGS_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # WHICH key this run is holding — derived from the private half, so it is a PUBLIC key and
      # safe to print. Without it the first deployment failed as a bare
      # `Permission denied (publickey,password)`, which is the same message for five different
      # causes: a key that is not the pair of the one the host trusts, a key that did not survive
      # being pasted into the secret box, the wrong user, loose modes on the host's `.ssh`, and an
      # `authorized_keys` line the host cannot parse. The host's side of that question is one
      # `ssh-keygen -lf ~coai-bugs-deploy/.ssh/authorized_keys`; this is the other side, and
      # comparing two fingerprints answers it in a second.
      #
      # It fails the run when the private half cannot be read at all, because "cannot be read" is a
      # malformed secret and that is worth saying plainly rather than letting ssh report it as a
      # refusal by the server.
      - name: Which key this run holds
        run: |
          set -uo pipefail

          # The LINE COUNT, and deliberately nothing else about the file.
          #
          # This step first printed the BEGIN and END lines too, on the reasoning that they are not
          # secret and are exactly what a truncated paste loses. Both came back as `***`: the
          # runner masks any substring of a secret's value, and those lines are part of it. So the
          # idea cannot work, and the count is what survives — an unencrypted ed25519 key is 7
          # lines, an encrypted one is longer, and a truncated paste is shorter than either.
          echo "the key has $(wc -l < ~/.ssh/id_bugs) lines"

          # `-P ''` supplies an EMPTY passphrase rather than leaving ssh-keygen to ask for one,
          # which is what separates the two causes: an encrypted key answers "incorrect passphrase"
          # and a damaged one answers "invalid format". Without this they are one failure with one
          # message, and the fix for each is different.
          if ssh-keygen -y -P '' -f ~/.ssh/id_bugs > ~/.ssh/id_bugs.pub 2>/tmp/keyerr; then
            echo "this run offers: $(ssh-keygen -lf ~/.ssh/id_bugs.pub)"
            echo "the host must list the same fingerprint in ~coai-bugs-deploy/.ssh/authorized_keys"
            exit 0
          fi

          if grep -qi passphrase /tmp/keyerr; then
            echo "::error::BUGS_DEPLOY_KEY is protected by a PASSPHRASE. A deploy runs unattended and"
            echo "::error::has nobody to type one, so this key cannot be used as it is. Strip it with"
            echo "::error::'ssh-keygen -p -N \"\" -f <keyfile>' and re-paste, or generate the pair again"
            echo "::error::with 'ssh-keygen -t ed25519 -N \"\" -C coai-bugs-deploy-ci' and put the new"
            echo "::error::public half in the host's authorized_keys."
          else
            echo "::error::BUGS_DEPLOY_KEY could not be read as an OpenSSH private key: truncated,"
            echo "::error::re-wrapped, or the wrong kind of value. An unencrypted ed25519 key is 7"
            echo "::error::lines; compare that with the count above and re-paste the WHOLE file,"
            echo "::error::BEGIN and END lines and the trailing newline included."
          fi
          # What ssh-keygen itself said, which names neither the key nor any part of it.
          sed 's#/home/[^ ]*/id_bugs#<the key>#g' /tmp/keyerr
          exit 1

      # The server's own secret AND its administrators, delivered from the secret store rather than
      # typed on the box. Both reach the host over ssh on STDIN — never as arguments, which `ps` and
      # the auth log see.
      #
      # THE ADMINISTRATORS ARE REQUIRED HERE, and that is not a contradiction of the server treating
      # an absent variable as legitimate. They are different questions: the SERVER may be run with no
      # administrators by anybody who wants to, and this REPOSITORY'S deployment of it exists to
      # carry them — the whole reason story 4 was written is that nothing did, and a release started
      # perfectly and answered 401 to every admin call with nothing noticing. An empty secret box
      # here is a mistake, not a configuration.
      - name: The server's secret and its administrators, from the secret store
        env:
          HOST: ${{ secrets.BUGS_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.BUGS_DEPLOY_USER }}
          COAI_BUGS_SECRET: ${{ secrets.COAI_BUGS_SECRET }}
          COAI_BUGS_ADMIN_KEYS: ${{ secrets.COAI_BUGS_ADMIN_KEYS }}
        run: |
          set -euo pipefail
          [[ -n "${COAI_BUGS_SECRET:-}" ]] \
            || { echo "COAI_BUGS_SECRET is not set in this repository's secrets"; exit 1; }
          [[ -n "${COAI_BUGS_ADMIN_KEYS:-}" ]] \
            || { echo "COAI_BUGS_ADMIN_KEYS is not set in this repository's secrets. It is the key list encoded with 'base64 -w0', and the list must begin with '# coai-bugs-admin-keys v1' — the server refuses anything else, because a raw key can be valid base64 and guessing would configure administrators nobody holds."; exit 1; }
          # WHITESPACE IS REFUSED HERE, before anything is sent. A value pasted from `base64` without
          # -w0 wraps at 76 columns, and only its first chunk would survive the two-line protocol
          # below — leaving a value that decodes to a PREFIX of the list, where the first key works
          # and later administrators silently do not. The installer refuses a third line for the same
          # reason; this says it where the operator can act on it. (Code round, codex.)
          [[ "$COAI_BUGS_ADMIN_KEYS" != *[$' \t\n\r']* ]] \
            || { echo "COAI_BUGS_ADMIN_KEYS contains whitespace. It must be one line with no wrapping: pipe the list through 'base64 -w0'."; exit 1; }
          # The value is base64 ON PURPOSE and travels as it is stored: the list is newline-separated
          # and a systemd EnvironmentFile assignment cannot hold a newline. Nothing here decodes or
          # re-encodes it — an encoding step in the middle is a second place for the two ends to
          # disagree about what a key is.
          #
          # `secret` is the only other thing the forced command answers. It reads TWO lines from
          # stdin, writes /etc/coai-bugs/env with 0640 root:coai-bugs, and prints nothing back.
          printf '%s\n%s\n' "$COAI_BUGS_SECRET" "$COAI_BUGS_ADMIN_KEYS" \
            | ssh -i ~/.ssh/id_bugs -o StrictHostKeyChecking=yes -o BatchMode=yes \
                  "$USER_NAME@$HOST" secret

      # IDENTIFIED, because the rollback step below has to tell two different failures apart.
      - name: Deploy, and let the host's script decide
        id: deploy
        env:
          HOST: ${{ secrets.BUGS_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.BUGS_DEPLOY_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_bugs -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$USER_NAME@$HOST" "deploy $VERSION"

      # THE EDGE, which is the half the host cannot check for itself.
      #
      # `release.sh`'s canary already proved the new build serves `/health` on loopback — that is
      # what decided the deploy. What it cannot see is nginx, TLS and DNS, so this asks the same
      # question from the internet and that is the whole of its job.
      #
      # It deliberately does NOT assert a version, and the step used to be named as though it did,
      # with an unused `VERSION` in its environment saying so. `/health` answers `{"status":"ok"}`
      # and carries no version on purpose: it is unauthenticated and faces the public internet, so
      # a build banner there would tell anybody which release is running. The release that is
      # serving is established on the host, where that information already is. (CodeRabbit, #328.)
      - name: The edge reaches the new build
        id: edge
        run: |
          set -euo pipefail
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 5 https://bugs.remsoft.dev/health | grep -q ok; then
              echo "bugs.remsoft.dev answers /health"
              exit 0
            fi
            sleep 3
          done
          echo "bugs.remsoft.dev did not answer /health after the deploy"
          exit 1

      # AND ADMINISTRATION ITSELF, which is the half nothing checked and the reason this story exists.
      #
      # `/health` is public and answers `ok` whether or not a single administrator is configured, so
      # every check above this line passes on a server whose admin API refuses everybody. This makes
      # one authenticated request and fails the run when it is not answered.
      #
      # IT IS ASKED ON THE HOST, and the WHOLE LIST is what is sent. The forced command's
      # `admin-check` decodes it, takes the first usable key, curls loopback and prints only the
      # status code — so the credential never crosses the edge and never becomes an argument
      # anywhere, and there is ONE implementation of "which line is a key". A copy of that rule here
      # would be a copy that drifts from the server's, and a check that tests a key the server does
      # not hold reports a failure nobody can find. (Code round, gemini.)
      #
      # AND IT DOES NOT ROLL BACK, deliberately. A 401 here is a CONFIGURATION failure — the keys are
      # wrong, or were never re-encoded — and the previous release has no admin surface at all, so
      # retreating to it would take a good build out of service to fix nothing. The run fails loudly,
      # the build keeps serving, and the remedy is the secret box and another deploy.
      - name: Administration works on the deployed build
        env:
          HOST: ${{ secrets.BUGS_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.BUGS_DEPLOY_USER }}
          COAI_BUGS_ADMIN_KEYS: ${{ secrets.COAI_BUGS_ADMIN_KEYS }}
        run: |
          set -euo pipefail
          # The ssh exit status is kept apart from the ANSWER: a refused connection and a 401 send an
          # operator to two different places, and folding them together says only "exit 1".
          set +e
          code=$(printf '%s\n' "$COAI_BUGS_ADMIN_KEYS" \
                 | ssh -i ~/.ssh/id_bugs -o StrictHostKeyChecking=yes -o BatchMode=yes \
                       -o ConnectTimeout=10 "$USER_NAME@$HOST" admin-check 2>/tmp/admin-check.err)
          transport=$?
          set -e
          if [[ $transport -ne 0 ]]; then
            echo "::error::the host could not be asked whether administration works (ssh exited $transport)"
            sed 's#/home/[^ ]*/id_bugs#<the key>#g' /tmp/admin-check.err
            exit 1
          fi
          # 200 is the only pass. 401 is the exact failure this story is about — the keys never
          # arrived, or arrived in a shape the server refused — and 000 is a unit that never came
          # back up, which the host's own canary should have caught first.
          [[ "$code" == "200" ]] \
            || { echo "::error::administration is not working on the deployed build: the host answered $code"; exit 1; }
          echo "an authenticated /admin/keys answered 200"

      # ONLY when the host thinks it succeeded, and that condition is the point.
      #
      # `if: failure()` fired for EITHER failure, and the deploy failing is the case where
      # `release.sh` has ALREADY rolled back and exited 1. A second `--rollback` then pops another
      # entry off the trail: with two earlier releases it retreats one further than anybody asked,
      # and with one it finds nothing to go back to and STOPS the service. A canary doing its job —
      # rejecting a bad build and restoring the good one — would have ended as an outage.
      #
      # So this runs only when the deploy step SUCCEEDED and something after it did not, which is
      # exactly the case the host does not know about: the edge never came back. (CodeRabbit, #328.)
      #
      # NAMED, rather than `failure()` alone: since the administration check joined the run, a bare
      # `failure()` would retreat a perfectly good build because a KEY was wrong. The condition is
      # the edge specifically, which is the one thing a rollback actually repairs.
      #
      # `!= 'success'` rather than `== 'failure'`: a step CANCELLED by a job timeout has neither
      # outcome, and an edge check that hung would otherwise leave a broken edge with no rollback.
      # (Code round, gemini.)
      - name: Roll back, and say so
        if: failure() && steps.deploy.outcome == 'success' && steps.edge.outcome != 'success'
        env:
          HOST: ${{ secrets.BUGS_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.BUGS_DEPLOY_USER }}
        run: |
          set -euo pipefail
          echo "::error::the host installed it but the edge never answered; rolling back"
          ssh -i ~/.ssh/id_bugs -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$USER_NAME@$HOST" "deploy --rollback"

      # And when the DEPLOY is what failed, say what the host already did rather than doing it
      # again. A run that ends here has a service on its previous release, or stopped — `release.sh`
      # decided which, and its output is above.
      - name: The host rolled itself back
        if: failure() && steps.deploy.outcome == 'failure'
        run: |
          echo "::error::the host rejected this build; release.sh has already restored the previous release or stopped the unit. Nothing further was sent, because a second rollback would retreat past the release that is serving."
