name: pr · title

# The subject is free text on purpose: proper nouns start with capitals — SonarCloud, CodeRabbit,
# Dependabot — and a pattern forbidding a capital first letter rejected six real pull requests in a
# row, including every one Dependabot opens. The TYPE prefix is the rule; the sentence after it is
# somebody's writing.
#
# The pull request title becomes the line in main's history (rebase keeps commits, squash uses the
# title), so it has to say what changed in the family's own shape: `type: what changed`.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read
  # Read, to list each commit's files for the Markdown rule below.
  contents: read

jobs:
  semantic:
    name: pr · semantic title
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit, not a tag: a tag can be moved under you, and this action reads the
      # pull request with a token. SonarCloud githubactions:S7637, 2026-09-05. Dependabot keeps the
      # comment's version current — it rewrites both the SHA and the trailing tag.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            chore
            refactor
            perf
            ci
            build
          requireScope: false

      # DOCUMENTATION ALONE (Markdown and pictures) NEVER OPENS A RELEASE — the operator's rule, 2026-09-26
      # (research/PLAN_the_release_guards_contradict.md). release-please releases on the commit TYPE and
      # cannot exclude files by pattern, so the type is held here: a releasing title or commit whose
      # files under some package are all documentation (`.md` and pictures) is refused. A step of THIS job, because this job is a
      # required check — a job of its own would be advisory until branch protection named it.
      #
      # `pull_request_target` checks out the BASE branch, so the script that runs is main's, never the
      # pull request's own code; the title reaches it as an environment variable, never pasted into
      # the shell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Documentation alone never opens a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/docs-only-title.mjs --pr "$PR_NUMBER"
