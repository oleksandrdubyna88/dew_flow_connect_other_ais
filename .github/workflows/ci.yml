name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build · test · family checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the rules submodule — never `submodules: recursive`, which would drag whatever
      # code submodules appear later into a markdown walk (conventions ROLLOUT.md).
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .claude/rules/shared

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build dew_flow_connect_other_ais.slnx -c Release

      # xUnit v3 on Microsoft Testing Platform: the test project builds into a self-contained
      # runner executable. `dotnet test` has no VSTest host here and would abort — never use it
      # (.claude/rules/shared/common/testing.md). No `.exe` suffix on Linux.
      - name: Test
        run: ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests

      # The bench is BUILT by the solution and is deliberately not a release asset, so this step is
      # the only thing that would ever notice it breaking. An instrument nobody checks reports
      # whatever it last happened to compile to.
      - name: Test the bench
        run: ./src_bench/CoaiBench.Tests/bin/Release/net10.0/CoaiBench.Tests

      # The rules that check themselves: a misfiled plan and a stale pin are red builds,
      # not discoveries.
      - name: Plan lifecycle
        run: node .claude/rules/shared/tools/plan-lifecycle.mjs

      - name: Pin check
        run: node .claude/rules/shared/tools/pin-check.mjs

      # A workflow file that does not PARSE fails at startup, in zero seconds, with no job, no log
      # and no annotation — and the run that discovers it is the release you just tagged. Measured
      # 2026-09-03: a single stray carriage return inside a quoted `tr -d '\r'` reads as a line
      # break in a YAML block scalar, so `mcp-v0.12.3` and `extension-v0.27.0` both had to be
      # burned and re-cut. Parsing them here costs a second and turns that into a red PR.
      - name: Workflows parse
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              raw = path.read_bytes()
              stray = raw.count(b'\r') - raw.count(b'\r\n')
              if stray:
                  bad.append(f'{path}: {stray} bare carriage return(s) — a line break to YAML')
              try:
                  yaml.safe_load(raw.decode('utf-8'))
              except Exception as error:
                  bad.append(f'{path}: {error}')
          print('\n'.join(bad) if bad else 'workflows parse')
          sys.exit(1 if bad else 0)
          PY

  extension:
    name: extension · typecheck · test · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # `npm ci` needs the lockfile to match; the extension has zero runtime dependencies,
      # so this installs only the build/test toolchain.
      - name: Install
        working-directory: src_vs_code
        run: npm ci

      - name: Test
        working-directory: src_vs_code
        run: npm test

      # Packaging is part of CI because a .vsix that only builds on one machine is a release
      # that fails at the last step.
      - name: Package
        working-directory: src_vs_code
        run: npm run package
