name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build · test · family checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the rules submodule — never `submodules: recursive`, which would drag whatever
      # code submodules appear later into a markdown walk (conventions ROLLOUT.md).
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Shared instruction dependencies and pin verification
        run: |
          npm ci --ignore-scripts --prefix .agents/conventions
          node .agents/conventions/tools/rules.mjs check --repo .

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # BEFORE the build: a formatting complaint is cheaper to read than a build log, and it
      # costs seconds. `--verify-no-changes` REPORTS and never rewrites — CI must not push a
      # reformat into somebody's branch, it must say the branch is not formatted and stop.
      - name: Formatted
        run: dotnet format dew_flow_connect_other_ais.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build dew_flow_connect_other_ais.slnx -c Release

      # xUnit v3 on Microsoft Testing Platform: the test project builds into a self-contained
      # runner executable. `dotnet test` has no VSTest host here and would abort — never use it
      # (.agents/conventions/common/testing.md). No `.exe` suffix on Linux.
      - name: Test
        run: ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests

      # The end-of-run audit has teeth (E5 S6, plan D9; the template's step). LeftoversSelfTest leaks a folder on purpose, ONLY when COAI_LEFTOVERS_SELFTEST
      # is set; this step is green only on a NON-zero exit with the audit's first line and the folder's name on its own line, and with nothing of the case left.
      - name: The audit fails a run that leaves a claimed folder
        run: |
          set -o pipefail
          owner="u$(id -u)"
          for entry in "1:never disposed:selftest" "failed-dispose:disposed but not removed:selftest-failed"; do
            IFS=: read -r value words what <<< "$entry"
            if COAI_LEFTOVERS_SELFTEST="$value" ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests --filter-class "*LeftoversSelfTest" 2>&1 | tee "$RUNNER_TEMP/selftest.log"; then
              echo "the end-of-run audit did not fail the run ($value)"; exit 1; fi
            first=$(grep -E "(^|[[:space:]]:[[:space:]])coai tests: this run left [0-9]+ folder\(s\) it claimed.*[0-9]+ $words" "$RUNNER_TEMP/selftest.log" | grep -v "testsToDelete-[uw][0-9]" || true)
            [ -n "$first" ] || { echo "the run failed, but not with the audit's first line (counts and '$words', no path) ($value)"; exit 1; }
            grep -Eq "^[[:space:]]+$words: .*/testsToDelete-[uw][0-9]{1,10}-coai-$what-[A-Za-z0-9]{6}" "$RUNNER_TEMP/selftest.log" \
              || { echo "the audit's message does not name the folder on a line of its own under '$words' ($value)"; exit 1; }
            left=$(find "${TMPDIR:-/tmp}" -maxdepth 1 \( -iname "teststodelete-${owner}-coai-$what-*" -o -iname "teststodelete-${owner}-coai-run-*" \)) \
              || { echo "the temp root could not be listed"; exit 1; }
            [ -z "$left" ] || { echo "the run left this behind: $left"; exit 1; }
          done

      # The bench is BUILT by the solution and is deliberately not a release asset, so this step is
      # the only thing that would ever notice it breaking. An instrument nobody checks reports
      # whatever it last happened to compile to.
      - name: Test the bench
        run: ./src_bench/CoaiBench.Tests/bin/Release/net10.0/CoaiBench.Tests

      # THE OTHER TWO BINARIES, which this job did not run at all.
      #
      # `coai-server` has had 320 tests and `coai-bugs` arrived with 29, and neither suite was
      # executed by the check that gates every pull request — so a regression in either was invisible
      # here and waited for a release or for somebody running them by hand. Both DO run on Linux
      # already, under `dotnet-coverage` in the sonarcloud job, which is how we know they pass on a
      # runner; they were simply never added to the gate that is allowed to say no.
      #
      # `sonarExclusions.test.ts` asserts every `*.Tests.csproj` in the repository appears in both
      # workflows, so the fourth binary cannot repeat this.
      - name: Test the Team server
        run: ./src_server/tests/bin/Release/net10.0/CoaiServer.Tests

      # One test in the ingest suite runs the PREVIOUS release, and FAILS on CI when it is absent:
      # a silently skipped check is a silently deleted one. See the action for why it is pinned.
      - name: Fetch the previous ingest server
        uses: ./.github/actions/fetch-old-bugs
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}

      - name: Test the ingest server
        run: ./src_bugs/tests/bin/Release/net10.0/CoaiBugs.Tests

      # The rules that check themselves: a misfiled plan and a stale pin are red builds,
      # not discoveries.
      # The server ships as Native AOT and now carries a native dependency (SQLite). A trim or IL
      # warning that only appears at publish time used to be discovered by a release; it is a
      # pull-request check now, which is what the review gate asked for on 2026-09-05.
      - name: Publish the server the way it ships (Native AOT)
        run: dotnet publish src_mcp/src/CoaiMcp.csproj -c Release -r linux-x64 -warnaserror

      # The only check that can see BOTH halves of the client/server contract at once. Every other
      # test on either side stubs the other, which is how 0.31.1 shipped a sign-in nobody could
      # use: the extension posted the identity token in the request BODY, the server reads it from
      # the Authorization header, and both suites were green about their own half.
      #
      # It runs HERE rather than in the extension job because this one already has the .NET SDK and
      # has just compiled the server — `run-contract.mjs` starts that build on a loopback port with
      # a throwaway data directory. Building `src_server/Dockerfile` instead would be the same test
      # for minutes more: it publishes Native AOT (clang, a full link) on every pull request. The
      # container is still the better LOCAL story, and the script takes COAI_CONTRACT_URL for it.
      # `--ignore-scripts`: this step needs `tsc` and `node` and nothing else, so no dependency's
      # postinstall has any business running here — and a lifecycle script is where a compromised
      # package gets its code executed. (The extension job's own `npm ci` keeps them, because
      # `npm run package` needs esbuild's platform binary linked.) Raised by SonarCloud as S6505.
      - name: Install the extension's toolchain
        working-directory: src_vs_code
        run: npm ci --ignore-scripts

      - name: Contract — the real client against the real server
        working-directory: src_vs_code
        run: npm run test:contract

      # The other seam neither container owns: the extension WRITES <dataDir>/settings.json and
      # coai-mcp READS it. Both suites were green for the whole life of the `remote` runtime while
      # `remoteVendor` never crossed, and every Team-server reviewer was dropped from every round.
      - name: Seam — the extension's own settings file, read by the real coai-mcp
        working-directory: src_vs_code
        run: npm run test:seam

      # The THIRD thing neither container owns: `server-notices.jsonl` is written by C# and read by
      # TypeScript, and BOTH halves redact before anything reaches disk. Two suites that each compare
      # themselves against their own expectations can both be wrong in the same direction, which here
      # means a secret written by one half that the other would have taken out. This runs both
      # implementations over one corpus.
      #
      # It lives in THIS job because it is the only one where both runtimes exist: the .NET suites
      # run before `npm ci`, so a C# test cannot spawn node. It drives `NoticeTool`, a test-only
      # executable built by the solution and never published — the FakeCli pattern.
      #
      # Watched failing by replacing the redactor's ASCII lookbehind with .NET's own
      # word-boundary escape, which is Unicode-aware where JavaScript's is not: the server
      # then left `token abcdefghijklmnop` unredacted after Cyrillic text while the
      # extension removed it. The escape is NAMED here rather than spelled: spelling it is
      # exactly what put a raw 0x08 byte in this file, and YAML refuses a C0 control byte —
      # the whole workflow stopped parsing, its three required checks never reported, and
      # the pull request sat blocked with every check a person could see passing.
      - name: Parity — both notice serialisers over one corpus
        working-directory: src_vs_code
        run: npm run test:parity

      # The changelog baseline is what lets the release guard notice a note going MISSING, but it
      # lives in the repository it guards — so one commit deleting a note AND its baseline row would
      # pass everything. Pinned to the pull request's own base commit: `origin/main` does not exist
      # in a shallow checkout, and on main the comparison would be a commit against itself.
      - name: The changelog baseline only grows
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          ABSENT=
          if git cat-file -e "$BASE_SHA:.github/changelog-baseline.json" 2>/dev/null; then
            git show "$BASE_SHA:.github/changelog-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          else
            echo '{}' > "$RUNNER_TEMP/base-baseline.json"
            ABSENT=--base-absent
          fi
          node .github/scripts/baseline-only-grows.mjs ${ABSENT:+"$ABSENT"}             .github/changelog-baseline.json "$RUNNER_TEMP/base-baseline.json"

      # The lint ratchet, and the same shape as the changelog one above for the same reason: it
      # lives in the repository it guards. `eslint-suppressions.json` is what lets `complexity`
      # and `max-lines-per-function` be ON for `src/**` while 615 violations that predate the
      # decision stay recorded rather than forgiven — and without this it is simply a place to put
      # a new one. A TOTAL is not enough: fix one old violation, add one new, regenerate, and the
      # count falls while new code is suppressed. The comparison is per file and per rule.
      - name: Lint suppressions only shrink
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          ABSENT=
          if git cat-file -e "$BASE_SHA:src_vs_code/eslint-suppressions.json" 2>/dev/null; then
            git show "$BASE_SHA:src_vs_code/eslint-suppressions.json" > "$RUNNER_TEMP/base-suppressions.json"
          else
            echo '{}' > "$RUNNER_TEMP/base-suppressions.json"
            ABSENT=--base-absent
          fi
          node .github/scripts/suppressions-only-shrink.mjs ${ABSENT:+"$ABSENT"} \
            src_vs_code/eslint-suppressions.json "$RUNNER_TEMP/base-suppressions.json"
      # The raw-temp baseline only shrinks (E5 S6; common/test-leftovers-baseline.md, The ratchet). Never the creation flag here. PR 945 is the one creation, recorded there.
      - name: The raw-temp baseline only shrinks
        if: github.event_name == 'pull_request' && github.event.pull_request.number != 945
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          node .agents/conventions/tools/leftovers-check.mjs --repo . --baseline-shrinks --base "$BASE_SHA"
      - name: Plan lifecycle
        run: node .agents/conventions/tools/plan-lifecycle.mjs
      # The measurement scripts' own tests — today `scripts/lib/kimi.test.mjs`, the refusal of a Kimi probe scratch another
      # local user could read (the copied sign-in sits there until the scrub). A test CI never runs guards nothing. The
      # runner (E5 S2-B) sweeps the real temp root FIRST, as every run that creates the kind does (the rule's start-of-run sweep),
      # then starts node's own glob, `node --test "scripts/**/*.test.mjs"`, so a new `scripts/**/*.test.mjs` is picked up without
      # touching this step. On Linux the mode-bit cases run; they skip only on Windows, which has none.
      - name: Probe script tests
        run: node scripts/run-lib-tests.mjs
      # The protection `main` is supposed to have is a FILE now — `.github/branch-protection.json` —
      # because branch protection is the one part of a repository's CI that is not IN the repository.
      # Nothing makes GitHub read it; what it buys is that the intent is reviewed, and that the drift
      # from it is something a command prints rather than something nobody finds.
      #
      # This step is the half that needs no token: the comparison logic, against fixtures. It caught
      # three real bugs in that logic the first time it ran. Comparing to the REAL branch needs
      # repository admin, so `node .github/scripts/branch-protection.mjs` is run by hand.
      - name: Branch protection selftest
        run: node .github/scripts/branch-protection.mjs --selftest

      - name: Pin check
        run: node .agents/conventions/tools/pin-check.mjs

      # The Claude host adapter, which nothing else can notice going wrong: a session that never
      # received the rules behaves exactly like one that received them and chose badly.
      - name: Adapter check
        run: node .agents/conventions/tools/adapter-check.mjs .

      # This product's own gate rule is the shared one now, and this repository is where the text
      # comes from — so a copy here would be the source disagreeing with itself.
      - name: Gate snippet
        run: node .agents/conventions/tools/gate-snippet-check.mjs

      # The half of `csharp/dotnet-build.md` no file can enforce is a PreToolUse hook, and a hook is
      # a thing that can silently stop being wired. This asks the repository instead: the response
      # file is there, and it says what it has to say.
      - name: Build flags
        run: node .agents/conventions/tools/build-flags-check.mjs

      # A workflow file that does not PARSE fails at startup, in zero seconds, with no job, no log
      # and no annotation — and the run that discovers it is the release you just tagged. Measured
      # 2026-09-03: a single stray carriage return inside a quoted `tr -d '\r'` reads as a line
      # break in a YAML block scalar, so `mcp-v0.12.3` and `extension-v0.27.0` both had to be
      # burned and re-cut. Parsing them here costs a second and turns that into a red PR.
      - name: Workflows parse
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              raw = path.read_bytes()
              stray = raw.count(b'\r') - raw.count(b'\r\n')
              if stray:
                  bad.append(f'{path}: {stray} bare carriage return(s) — a line break to YAML')
              try:
                  yaml.safe_load(raw.decode('utf-8'))
              except Exception as error:
                  bad.append(f'{path}: {error}')
          print('\n'.join(bad) if bad else 'workflows parse')
          sys.exit(1 if bad else 0)
          PY

  # THE SAME SUITES ON macOS, on every pull request.
  #
  # Every other job here is Linux, so a defect only macOS has waited for a release to be seen, and on
  # 2026-09-23 one did: `mcp-v0.31.0` failed on `osx-arm64` alone — nine review-tree tests, because
  # every macOS temp directory is behind a link (`/var` is `/private/var`) and git records a worktree
  # by its real path (#470). Pull-request CI was green; the tag was the first thing that ran them there.
  #
  # The three suites that run on a Mac in production. The ingest server's suite is not here: it ships
  # for Linux only, and one of its tests runs the previous linux-x64 release.
  macos:
    name: macOS · mcp · server · bench
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `StageRulesTests` reads the mounted rules; without the submodule it fails, as it once failed
      # two releases (see release.yml's note on the same step).
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      # E5 S4 (must-not-copy #12, the plan's P12): the Node run folder on macOS, where `os.tmpdir()` is /var/folders/… and a link into /private/var. W10 (owned.test.mjs) makes the
      # run folder under it and asserts the wrap's `isMine` both ways; the proofs and the runner's refusals run here for the first time. Seconds, not minutes; no `npm ci`.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # E5 S6: the Node guard (testLeftovers.test.mjs) reads workflows and needs `yaml`, which the mount carries after this `npm ci`; the C# guard needs only node and the mount.
      - name: Shared instruction dependencies
        run: npm ci --ignore-scripts --prefix .agents/conventions
      - name: The Node run folder and its refusals (macOS, #12), and the Node guard
        working-directory: src_vs_code
        run: node scripts/run-tests.mjs src/test/leftoversSweep.test.mjs src/test/runFolder.test.mjs src/test/owned.test.mjs src/test/runTests.test.mjs src/test/testLeftovers.test.mjs
      - name: The scripts' run folder and its refusals (macOS)
        run: node scripts/run-lib-tests.mjs scripts/runFolder.test.mjs

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # E5 S3. Order: who the runner is; the build; the layout self-test (its values are printed as test warnings; every identity read of the
      # leftovers helper fails loudly if the layout does not hold); the Leftovers namespace; then the suites, each only when the build was green.
      # The machine, printed; anything but Arm64 is red with a clear message (the Darwin layout was measured on Arm64 only).
      - name: The runner is Arm64 (uid and system printed)
        run: |
          arch="$(uname -m)"
          echo "uname -m: $arch; uid: $(id -u); gid: $(id -g); $(sw_vers -productName) $(sw_vers -productVersion)"
          [ "$arch" = "arm64" ] || { echo "this runner is $arch, not arm64: the Darwin layout was measured on Arm64 only, and the x86-64 entry points were never run"; exit 1; }

      - name: Build
        id: build
        run: dotnet build dew_flow_connect_other_ais.slnx -c Release

      # The runner's architecture as .NET sees it and every value of the self-test (offsets of struct stat checked against getuid, a known file,
      # a known mtime and stat(1)). The grep proves the values were PRINTED and that the uid read is the shell's.
      - name: The stat layout self-test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests --filter-class "*DarwinLayoutTests" 2>&1 | tee layout.log
          grep -Eq "darwin layout: arch=Arm64" layout.log || { echo "the self-test did not report ProcessArchitecture Arm64"; exit 1; }
          grep -Eq "darwin layout: getuid=$(id -u)\$" layout.log || { echo "the self-test did not report the shell's uid $(id -u)"; exit 1; }
          grep -Eq "darwin layout: file: dev=" layout.log || { echo "the self-test did not print the values it read"; exit 1; }

      # The helper's own tests alone first, so a defect in the library is named before the whole suite buries it.
      - name: Leftovers
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests --filter-namespace "CoaiMcp.Tests.Leftovers"

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests

      # E5 S6: the same teeth as build-test's step, on macOS (bash 3.2 and BSD grep and find: the commands are the template's portable subset).
      - name: The audit fails a run that leaves a claimed folder
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          owner="u$(id -u)"
          for entry in "1:never disposed:selftest" "failed-dispose:disposed but not removed:selftest-failed"; do
            IFS=: read -r value words what <<< "$entry"
            if COAI_LEFTOVERS_SELFTEST="$value" ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests --filter-class "*LeftoversSelfTest" 2>&1 | tee "$RUNNER_TEMP/selftest.log"; then
              echo "the end-of-run audit did not fail the run ($value)"; exit 1; fi
            first=$(grep -E "(^|[[:space:]]:[[:space:]])coai tests: this run left [0-9]+ folder\(s\) it claimed.*[0-9]+ $words" "$RUNNER_TEMP/selftest.log" | grep -v "testsToDelete-[uw][0-9]" || true)
            [ -n "$first" ] || { echo "the run failed, but not with the audit's first line (counts and '$words', no path) ($value)"; exit 1; }
            grep -Eq "^[[:space:]]+$words: .*/testsToDelete-[uw][0-9]{1,10}-coai-$what-[A-Za-z0-9]{6}" "$RUNNER_TEMP/selftest.log" \
              || { echo "the audit's message does not name the folder on a line of its own under '$words' ($value)"; exit 1; }
            left=$(find "${TMPDIR:-/tmp}" -maxdepth 1 \( -iname "teststodelete-${owner}-coai-$what-*" -o -iname "teststodelete-${owner}-coai-run-*" \)) \
              || { echo "the temp root could not be listed"; exit 1; }
            [ -z "$left" ] || { echo "the run left this behind: $left"; exit 1; }
          done

      - name: Test the Team server
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./src_server/tests/bin/Release/net10.0/CoaiServer.Tests

      - name: Test the bench
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./src_bench/CoaiBench.Tests/bin/Release/net10.0/CoaiBench.Tests

  # THE MCP SUITE ON WINDOWS, on every pull request.
  #
  # The Vibe path budget, the private-folder DACLs (PrivateFolder) and the junction and read-only-folder cases are Windows facts: on
  # Linux and macOS their tests skip, so until this job ran them a defect there waited for the owner's machine. The runner is ELEVATED,
  # so a folder it makes may be owned by Administrators (PrivateFolderWindowsTests.E1 accepts that), and a denial that does not bite an
  # elevated account skips its test with the reason (the Proven pattern of ConsultFailureScenarioTests). Only the MCP server's suite
  # runs whole: the others have no Windows-only behaviour yet — but the Team server's run-folder proofs run too (E5 S3, plan D8's merge-gate
  # table), and Step 0 measures who owns a new file before any helper code does.
  windows:
    name: Windows · mcp
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Step 0 (E5 S3, plan D8): the facts the leftovers helper's Windows assertions are written against, measured BEFORE any helper code runs, and
      # printed. A new file here is owned by BUILTIN\Administrators (the runner is elevated), not by the caller's SID: the kernel-owner key of the
      # sweep would otherwise not separate two fixtures. A runner image that changes either fact turns this step red, naming what to re-read.
      # It uses RUNNER_TEMP (job-scoped), never a machine temp path.
      - name: Step 0 — who owns a new file here
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $caller = $id.User
          $elevated = ([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $admins = New-Object Security.Principal.SecurityIdentifier([Security.Principal.WellKnownSidType]::BuiltinAdministratorsSid, $null)
          $dir = Join-Path $env:RUNNER_TEMP ('step0-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          [IO.Directory]::CreateDirectory($dir) | Out-Null
          $file = Join-Path $dir 'probe.txt'
          [IO.File]::WriteAllText($file, 'step 0')
          $fileOwner = (Get-Acl -LiteralPath $file).GetOwner([Security.Principal.SecurityIdentifier])
          $dirOwner = (Get-Acl -LiteralPath $dir).GetOwner([Security.Principal.SecurityIdentifier])
          Write-Host "step 0: caller SID = $($caller.Value); token owner SID = $($id.Owner.Value); elevated = $elevated"
          Write-Host "step 0: new file owner = $($fileOwner.Value); new folder owner = $($dirOwner.Value)"
          Write-Host "step 0: EqualSid(file owner, caller) = $($fileOwner.Equals($caller)); file owner is BUILTIN\Administrators = $($fileOwner.Equals($admins))"
          Remove-Item -LiteralPath $dir -Recurse -Force
          # The facts the helper's Windows assertions are written against (measured on mcp PR #58: dew_flow_mcp LeftoversSweepTests.cs:587-589).
          if ($null -eq $caller) { throw 'step 0: the caller has no user SID' }
          if (-not $elevated) { throw 'step 0: the runner is no longer elevated — re-read every Windows assertion of the leftovers helper (must-not-copy #6)' }
          if (-not $fileOwner.Equals($admins)) { throw "step 0: a new file is owned by $($fileOwner.Value), not BUILTIN\Administrators — re-read the Windows assertions (#6)" }
          if ($fileOwner.Equals($caller)) { throw 'step 0: the file owner equals the caller SID — the kernel-owner key would not separate the two fixtures (#6)' }
          exit 0

      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # E5 S6: the Node guard reads workflows and needs `yaml`, which the mount carries after this `npm ci` (the C# guard needs only node and the mount).
      - name: Shared instruction dependencies
        run: npm ci --ignore-scripts --prefix .agents/conventions
      # E5 S2-B (plan Q6, D8): the extension's start-of-run sweep is the MOUNTED reference with the coai token; on Windows it
      # must list and change nothing (F16 interim). The test file runs the real wrapper against the real reference here, with a
      # fixture that is collectible on every other key — a valid owner-form claim of this owner, an old mtime, a gone owner,
      # inside the profile — so that survival can come only from the Windows gate, never from a malformed claim. It needs no
      # `npm ci`: its import graph is node: modules and repository files only (L5 of the same file pins that). That sentence is about the sweep test; `testLeftovers.test.mjs` (E5 S6) runs the
      # mounted Node guard, which needs the mount's `npm ci` of the step above.
      #
      # E5 S4: through the RUNNERS, never a bare `node --test` (a test file refuses to start outside its run folder). The extension's runner makes the owned run folder,
      # fails closed before any test (exit 78 and one line when it cannot make or claim it), and runs exactly these files; the scripts' runner does the same for the proof
      # of the `scripts/` scope. Both proofs force the five failures (no folder, no claim, each of TEMP, TMP, TMPDIR different) and assert the sentinel test never loaded.
      - name: The Node sweep lists and changes nothing on Windows (F16, Q6); the Node run folder and its refusals
        working-directory: src_vs_code
        run: node scripts/run-tests.mjs src/test/leftoversSweep.test.mjs src/test/runFolder.test.mjs src/test/owned.test.mjs src/test/runTests.test.mjs src/test/testLeftovers.test.mjs
      - name: The scripts' run folder and its refusals
        run: node scripts/run-lib-tests.mjs scripts/runFolder.test.mjs

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build dew_flow_connect_other_ais.slnx -c Release

      - name: Test
        run: ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests.exe

      # The pin of the elevated-Windows limit must RUN here and PASS (E5 epoch 7, F31): the test skips off Windows or without elevation, and a skip is not a pass.
      # The hosted runner is elevated, so it must show `succeeded: 1` on its own line in this log.
      - name: The pin of the elevated-Windows limit ran and passed
        shell: pwsh
        run: |
          $log = (& ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests.exe --filter-method '*AnUntouchedClaim_StaysUnseen_OnAnElevatedWindowsRun*' 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          if ($code -ne 0) { throw "the pin failed (exit $code)" }
          if ($log -notmatch 'succeeded: 1\b') { throw 'the pin did not pass: a skip is not a pass (the runner must be elevated)' }
          exit 0

      # The release workflow runs this suite from Git Bash (release.yml, "Build and test"), and there the pin failed on both Windows
      # legs of mcp-v0.65.0 (run 42388147284): a process started from Git Bash owns the files it makes, so the audit DID see the
      # claim. The same suite must not pass here and fail at the release, so it runs here the way the release runs it, too. There the
      # test skips, saying why (it reads who owns a new file); the pwsh step above is the one that must show `succeeded: 1`.
      - name: The pin, run the way the release runs it (Git Bash)
        shell: bash
        run: |
          code=0  # `shell: bash` runs with -e: capture the exit code instead of letting it end the step before the log is shown
          log=$(./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests.exe --filter-method '*AnUntouchedClaim_StaysUnseen_OnAnElevatedWindowsRun*' 2>&1) || code=$?
          echo "$log"
          [ "$code" -eq 0 ] || { echo "::error::the pin failed under Git Bash (exit $code)"; exit 1; }
          # A filter that matched nothing also exits 0: the one test must have been found and run or skipped.
          grep -Eq 'total: 1\b' <<<"$log" || { echo "::error::the filter did not select the pin"; exit 1; }

      # The same teeth in PowerShell (the template's step). Both values; a listing error is red, never ignored.
      - name: The audit fails a run that leaves a claimed folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = './src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests.exe'
          $cases = @(
            @{ Value = '1'; Words = 'never disposed'; What = 'selftest' },
            @{ Value = 'failed-dispose'; Words = 'disposed but not removed'; What = 'selftest-failed' }
          )
          foreach ($case in $cases) {
            $env:COAI_LEFTOVERS_SELFTEST = $case.Value
            $log = (& $exe --filter-class '*LeftoversSelfTest' 2>&1 | Out-String)
            $code = $LASTEXITCODE
            Remove-Item Env:COAI_LEFTOVERS_SELFTEST
            Write-Host $log
            if ($code -eq 0) { throw "the end-of-run audit did not fail the run ($($case.Value))" }
            $firstLines = @($log -split "`r?`n" | Where-Object { $_ -match ('coai tests: this run left \d+ folder\(s\) it claimed.*\d+ ' + [regex]::Escape($case.Words)) -and $_ -notmatch 'testsToDelete-[uw][0-9]' })
            if ($firstLines.Count -eq 0) { throw "the run failed, but not with the audit's first line (counts and '$($case.Words)', no path) ($($case.Value))" }
            $named = '(?m)^\s*' + [regex]::Escape($case.Words) + ': .*[\\/]testsToDelete-[uw][0-9]{1,10}-coai-' + [regex]::Escape($case.What) + '-[A-Za-z0-9]{6}\s*$'
            if ($log -notmatch $named) { throw "the audit's message does not name the folder on a line of its own under '$($case.Words)' ($($case.Value))" }
            $left = @(Get-ChildItem -Force -LiteralPath $env:TMP -ErrorAction Stop | Where-Object { $_.Name -match ('^testsToDelete-[uw][0-9]{1,10}-coai-(' + [regex]::Escape($case.What) + '|run)-') })
            if ($left.Count -gt 0) { throw "the run left this behind: $($left.FullName -join ', ')" }
          }
          # Actions appends `exit $LASTEXITCODE` to a pwsh step: the self-test's EXPECTED non-zero exit would leak out as the step's result
          # (measured on dew_flow_mcp PR #58). Every check above throws on failure, so reaching here is green.
          exit 0

      # The Team server's own wiring of the run folder (E5 S3): its RunTempStart.cs made the folder, its TestEntryPoint.cs gates the run. The whole
      # server suite runs on Windows at release time (release.yml, server-binaries); here only the run-folder proofs, which need no server.
      - name: Run folder — Team server
        run: ./src_server/tests/bin/Release/net10.0/CoaiServer.Tests.exe --filter-class "*RunFolderTests"

  extension:
    name: extension · typecheck · test · package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # `fetch-tags` because one case in `changelogNamesTheRelease.test.ts` asks `git tag --list`:
      # it refuses a changelog baseline naming a version that was never released, which is a defect
      # this repository has actually had. Without this input the tag list is EMPTY and `git tag`
      # still exits 0 — so the case would not error, it would report every recorded release as a
      # phantom and fail naming the wrong cause. Tags only; the shallow fetch is untouched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      # The snippet the ⋯ menu hands out and the shared rule six repositories load must be the same
      # text, and the only test that can compare them reads the rule out of this submodule. Without
      # this step that test has nothing to read — and it FAILS here rather than skipping, because a
      # skip in CI is how a changed snippet merges behind a green tick. One submodule, depth 1: the
      # job needs a markdown file, not a history.
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Shared instruction dependencies and pin verification
        run: |
          npm ci --ignore-scripts --prefix .agents/conventions
          node .agents/conventions/tools/rules.mjs check --repo .

      # `npm ci` needs the lockfile to match; the extension has zero runtime dependencies,
      # so this installs only the build/test toolchain.
      - name: Install
        working-directory: src_vs_code
        run: npm ci

      # Before the tests: a lint failure is read in a second and a suite failure in a minute. The
      # config lives in the package, so this step says nothing about which rules are in force and
      # cannot drift from what a developer runs locally.
      #
      # This package had no linter at all until now — `typescript-eslint` declares peer
      # `typescript: ">=4.8.4 <6.1.0"`, the package was on 7.0.2, and the parser refuses that version
      # at install AND at run time. The compiler moved to 6.0.3 in the same change: the one version
      # that both compiles this source — shiki's ESM-only subpath imports included — and satisfies
      # the parser. Measured: zero typecheck errors, whole suite green. The reasoning is in
      # `src_vs_code/eslint.config.mjs`, next to the rules it explains.
      - name: Lint
        working-directory: src_vs_code
        run: npm run lint

      - name: Test
        working-directory: src_vs_code
        run: npm test

      # Packaging is part of CI because a .vsix that only builds on one machine is a release
      # that fails at the last step.
      - name: Package
        working-directory: src_vs_code
        run: npm run package

  # The one job that runs a REAL VS Code. `research/module_tests.md` carried twelve rows ending
  # "NOT covered … needs an extension host" and called the absence its largest single gap.
  #
  # NOT REQUIRED TO MERGE, and that is deliberate rather than timid: it downloads a 325 MB editor and
  # launches it, so it is slow and can fail for reasons that have nothing to do with the change under
  # review. Required on day one it becomes a tax on every pull request, and the pressure is then to
  # weaken it. PROMOTE IT TO REQUIRED once it has been green on TWENTY CONSECUTIVE RUNS OF main — a
  # number, so the promotion is a measurement rather than a mood. Until then it reports and nothing
  # more; `continue-on-error` is what makes that true of the CHECK and not only of the intention.
  extension-host:
    name: extension · a real editor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # `actions: read` is for the streak step at the end: listing this workflow's own runs and their
    # jobs is an Actions read, not a contents one. Job-level, so the rest of the workflow keeps the
    # contents-only default it has.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      - name: Shared instruction dependencies
        run: npm ci --ignore-scripts --prefix .agents/conventions

      - name: Install
        working-directory: src_vs_code
        run: npm ci

      # A headless Linux runner has no display, and VS Code is a desktop application: without this
      # the editor never starts and the failure says nothing about why. Named here because an unnamed
      # prerequisite is how this lands as a red pipeline nobody can read.
      - name: Run the scenarios in a real editor
        working-directory: src_vs_code
        run: xvfb-run -a npm run test:host

      # HOW CLOSE THIS JOB IS TO BEING REQUIRED, printed where somebody will see it. The comment at
      # the top of this job has said "twenty consecutive green runs of main" since the day it was
      # written, and nobody counted — so the plan that promoted this work had to record the promotion
      # as pending with no figure, because none had been measured. A rule whose number has to be
      # assembled by hand is a rule that stays unassembled.
      #
      # It REPORTS. Promotion means editing branch protection, which is the operator's to do; this
      # only makes the number impossible to not know. `if: always()` because the streak is most worth
      # reading on the run that just broke it.
      - name: How close this job is to being required
        if: always()
        working-directory: src_vs_code
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/host-job-streak.mjs

  # ---------------------------------------------------------------------------
  # The workflows themselves are code, and nothing checked them until now.
  #
  # actionlint reads every file under .github/workflows. The rule that earns its place on its own
  # is the script-injection one: a `${{ }}` expression written inline in a `run:` is pasted into
  # the shell source before bash parses it, and this family has already had to fix that by hand.
  # Separately, because ubuntu runners ship shellcheck, it lints the `run:` blocks as shell.
  #
  # NO NEW ACTION. actionlint publishes none — only a release binary — and every `uses:` line here
  # was just pinned to a commit SHA so the supply chain stays auditable. Pulling in an unpinnable
  # third-party action to get a linter would undo that. The binary is pinned by VERSION and verified
  # by CHECKSUM, which is the same promise a SHA pin makes: what runs is what was reviewed.
  #
  # Measured when this was added: zero in this repository and eighteen across the family, every one of them in a
  # release or deploy workflow, and all eighteen fixed before this job was allowed to fail on them.
  #
  # THE FIRST MEASUREMENT SAID ZERO EVERYWHERE AND WAS WRONG, which is why the step below asserts
  # shellcheck is present before linting. Without it actionlint keeps its OWN rules — the injection
  # check included — and silently drops the shell analysis of every `run:` block. No warning, exit
  # zero, a green check, and eighteen findings left standing.
  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          # The dependency this gate is quietly useless without — see the note above the job.
          command -v shellcheck > /dev/null || {
            echo "shellcheck is not on PATH: actionlint would skip every run: block and pass"
            exit 1
          }
          # Retried, because one HTTP 500 from the release host failed an unrelated Dependabot
          # pull request — measured on dew_flow_mcp #23. `--retry-all-errors` is the part that
          # matters: curl retries transport failures on its own, but treats a 500 as a final
          # answer. The checksum below still decides what runs, so this widens the window without
          # widening what is trusted.
          #
          # AND THE WINDOW WAS TWO ORDERS OF MAGNITUDE TOO SHORT, measured here on 2026-09-21: four
          # consecutive 504s between 14:53:19.86 and 14:53:25.89 — 6.08 seconds for the whole budget,
          # because `--retry-delay 2` REPLACES curl's exponential backoff with a flat two seconds. A
          # 504 from a CDN is a server-side outage measured in minutes. The guard was built for
          # exactly this and then given six seconds to do it in, so it failed looking like it worked.
          # Dropping the fixed delay restores the backoff (1, 2, 4, 8, 16 s); `--retry-max-time` is
          # the ceiling, well under this job's `timeout-minutes: 5`.
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-max-time 120 --retry-all-errors \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
