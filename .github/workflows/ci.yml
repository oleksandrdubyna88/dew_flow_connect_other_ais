name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build · test · family checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the rules submodule — never `submodules: recursive`, which would drag whatever
      # code submodules appear later into a markdown walk (conventions ROLLOUT.md).
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Shared instruction dependencies and pin verification
        run: |
          npm ci --ignore-scripts --prefix .agents/conventions
          node .agents/conventions/tools/rules.mjs check --repo .

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build dew_flow_connect_other_ais.slnx -c Release

      # xUnit v3 on Microsoft Testing Platform: the test project builds into a self-contained
      # runner executable. `dotnet test` has no VSTest host here and would abort — never use it
      # (.agents/conventions/common/testing.md). No `.exe` suffix on Linux.
      - name: Test
        run: ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests

      # The bench is BUILT by the solution and is deliberately not a release asset, so this step is
      # the only thing that would ever notice it breaking. An instrument nobody checks reports
      # whatever it last happened to compile to.
      - name: Test the bench
        run: ./src_bench/CoaiBench.Tests/bin/Release/net10.0/CoaiBench.Tests

      # THE OTHER TWO BINARIES, which this job did not run at all.
      #
      # `coai-server` has had 320 tests and `coai-bugs` arrived with 29, and neither suite was
      # executed by the check that gates every pull request — so a regression in either was invisible
      # here and waited for a release or for somebody running them by hand. Both DO run on Linux
      # already, under `dotnet-coverage` in the sonarcloud job, which is how we know they pass on a
      # runner; they were simply never added to the gate that is allowed to say no.
      #
      # `sonarExclusions.test.ts` asserts every `*.Tests.csproj` in the repository appears in both
      # workflows, so the fourth binary cannot repeat this.
      - name: Test the Team server
        run: ./src_server/tests/bin/Release/net10.0/CoaiServer.Tests

      - name: Test the ingest server
        run: ./src_bugs/tests/bin/Release/net10.0/CoaiBugs.Tests

      # The rules that check themselves: a misfiled plan and a stale pin are red builds,
      # not discoveries.
      # The server ships as Native AOT and now carries a native dependency (SQLite). A trim or IL
      # warning that only appears at publish time used to be discovered by a release; it is a
      # pull-request check now, which is what the review gate asked for on 2026-09-05.
      - name: Publish the server the way it ships (Native AOT)
        run: dotnet publish src_mcp/src/CoaiMcp.csproj -c Release -r linux-x64 -warnaserror

      # The only check that can see BOTH halves of the client/server contract at once. Every other
      # test on either side stubs the other, which is how 0.31.1 shipped a sign-in nobody could
      # use: the extension posted the identity token in the request BODY, the server reads it from
      # the Authorization header, and both suites were green about their own half.
      #
      # It runs HERE rather than in the extension job because this one already has the .NET SDK and
      # has just compiled the server — `run-contract.mjs` starts that build on a loopback port with
      # a throwaway data directory. Building `src_server/Dockerfile` instead would be the same test
      # for minutes more: it publishes Native AOT (clang, a full link) on every pull request. The
      # container is still the better LOCAL story, and the script takes COAI_CONTRACT_URL for it.
      # `--ignore-scripts`: this step needs `tsc` and `node` and nothing else, so no dependency's
      # postinstall has any business running here — and a lifecycle script is where a compromised
      # package gets its code executed. (The extension job's own `npm ci` keeps them, because
      # `npm run package` needs esbuild's platform binary linked.) Raised by SonarCloud as S6505.
      - name: Install the extension's toolchain
        working-directory: src_vs_code
        run: npm ci --ignore-scripts

      - name: Contract — the real client against the real server
        working-directory: src_vs_code
        run: npm run test:contract

      # The other seam neither container owns: the extension WRITES <dataDir>/settings.json and
      # coai-mcp READS it. Both suites were green for the whole life of the `remote` runtime while
      # `remoteVendor` never crossed, and every Team-server reviewer was dropped from every round.
      - name: Seam — the extension's own settings file, read by the real coai-mcp
        working-directory: src_vs_code
        run: npm run test:seam

      # The changelog baseline is what lets the release guard notice a note going MISSING, but it
      # lives in the repository it guards — so one commit deleting a note AND its baseline row would
      # pass everything. Pinned to the pull request's own base commit: `origin/main` does not exist
      # in a shallow checkout, and on main the comparison would be a commit against itself.
      - name: The changelog baseline only grows
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          ABSENT=
          if git cat-file -e "$BASE_SHA:.github/changelog-baseline.json" 2>/dev/null; then
            git show "$BASE_SHA:.github/changelog-baseline.json" > "$RUNNER_TEMP/base-baseline.json"
          else
            echo '{}' > "$RUNNER_TEMP/base-baseline.json"
            ABSENT=--base-absent
          fi
          node .github/scripts/baseline-only-grows.mjs ${ABSENT:+"$ABSENT"}             .github/changelog-baseline.json "$RUNNER_TEMP/base-baseline.json"

      - name: Plan lifecycle
        run: node .agents/conventions/tools/plan-lifecycle.mjs

      - name: Pin check
        run: node .agents/conventions/tools/pin-check.mjs

      # The Claude host adapter, which nothing else can notice going wrong: a session that never
      # received the rules behaves exactly like one that received them and chose badly.
      - name: Adapter check
        run: node .agents/conventions/tools/adapter-check.mjs .

      # This product's own gate rule is the shared one now, and this repository is where the text
      # comes from — so a copy here would be the source disagreeing with itself.
      - name: Gate snippet
        run: node .agents/conventions/tools/gate-snippet-check.mjs

      # The half of `csharp/dotnet-build.md` no file can enforce is a PreToolUse hook, and a hook is
      # a thing that can silently stop being wired. This asks the repository instead: the response
      # file is there, and it says what it has to say.
      - name: Build flags
        run: node .agents/conventions/tools/build-flags-check.mjs

      # A workflow file that does not PARSE fails at startup, in zero seconds, with no job, no log
      # and no annotation — and the run that discovers it is the release you just tagged. Measured
      # 2026-09-03: a single stray carriage return inside a quoted `tr -d '\r'` reads as a line
      # break in a YAML block scalar, so `mcp-v0.12.3` and `extension-v0.27.0` both had to be
      # burned and re-cut. Parsing them here costs a second and turns that into a red PR.
      - name: Workflows parse
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              raw = path.read_bytes()
              stray = raw.count(b'\r') - raw.count(b'\r\n')
              if stray:
                  bad.append(f'{path}: {stray} bare carriage return(s) — a line break to YAML')
              try:
                  yaml.safe_load(raw.decode('utf-8'))
              except Exception as error:
                  bad.append(f'{path}: {error}')
          print('\n'.join(bad) if bad else 'workflows parse')
          sys.exit(1 if bad else 0)
          PY

  extension:
    name: extension · typecheck · test · package
    runs-on: ubuntu-latest
    steps:
      # `fetch-tags` because one case in `changelogNamesTheRelease.test.ts` asks `git tag --list`:
      # it refuses a changelog baseline naming a version that was never released, which is a defect
      # this repository has actually had. Without this input the tag list is EMPTY and `git tag`
      # still exits 0 — so the case would not error, it would report every recorded release as a
      # phantom and fail naming the wrong cause. Tags only; the shallow fetch is untouched.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-tags: true

      # The snippet the ⋯ menu hands out and the shared rule six repositories load must be the same
      # text, and the only test that can compare them reads the rule out of this submodule. Without
      # this step that test has nothing to read — and it FAILS here rather than skipping, because a
      # skip in CI is how a changed snippet merges behind a green tick. One submodule, depth 1: the
      # job needs a markdown file, not a history.
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Shared instruction dependencies and pin verification
        run: |
          npm ci --ignore-scripts --prefix .agents/conventions
          node .agents/conventions/tools/rules.mjs check --repo .

      # `npm ci` needs the lockfile to match; the extension has zero runtime dependencies,
      # so this installs only the build/test toolchain.
      - name: Install
        working-directory: src_vs_code
        run: npm ci

      - name: Test
        working-directory: src_vs_code
        run: npm test

      # Packaging is part of CI because a .vsix that only builds on one machine is a release
      # that fails at the last step.
      - name: Package
        working-directory: src_vs_code
        run: npm run package

  # The one job that runs a REAL VS Code. `research/module_tests.md` carried twelve rows ending
  # "NOT covered … needs an extension host" and called the absence its largest single gap.
  #
  # NOT REQUIRED TO MERGE, and that is deliberate rather than timid: it downloads a 325 MB editor and
  # launches it, so it is slow and can fail for reasons that have nothing to do with the change under
  # review. Required on day one it becomes a tax on every pull request, and the pressure is then to
  # weaken it. PROMOTE IT TO REQUIRED once it has been green on TWENTY CONSECUTIVE RUNS OF main — a
  # number, so the promotion is a measurement rather than a mood. Until then it reports and nothing
  # more; `continue-on-error` is what makes that true of the CHECK and not only of the intention.
  extension-host:
    name: extension · a real editor
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Shared instruction dependencies
        run: npm ci --ignore-scripts --prefix .agents/conventions

      - name: Install
        working-directory: src_vs_code
        run: npm ci

      # A headless Linux runner has no display, and VS Code is a desktop application: without this
      # the editor never starts and the failure says nothing about why. Named here because an unnamed
      # prerequisite is how this lands as a red pipeline nobody can read.
      - name: Run the scenarios in a real editor
        working-directory: src_vs_code
        run: xvfb-run -a npm run test:host
