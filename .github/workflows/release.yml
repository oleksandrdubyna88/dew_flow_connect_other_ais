name: release

# Two products, two tag shapes, so releasing one never ships the other:
#   mcp-v0.2.3       → four Native AOT `coai-mcp` binaries attached to the release
#   extension-v0.8.0 → the .vsix, attached to the release AND published to the Marketplace
#                      when the VSCE_PAT secret exists (without it, the publish step skips
#                      OUT LOUD and the .vsix still lands on the release for a manual upload).
#   server-v0.5.1    → six Native AOT `coai-server` binaries AND a multi-arch image on ghcr.io.
#                      Both, because the two deployment shapes consume different things: a
#                      container host pulls the image, and `coai.remsoft.dev` runs the binary
#                      under systemd (deploy/README.md). The GitHub RELEASE is not decoration
#                      either — the panel's update check reads `…/releases`, not the tag list
#                      (src_vs_code/src/installer.ts), so a bare tag is invisible to it.
# (The guard-without-a-trigger trap is documented in creds' release.yml — a job's `if` is not a
# workflow trigger, so every tag shape is listed here.)
#
# EVERY line creates its release as a DRAFT and publishes it only once something has verified
# the assets are all there. A release is created by whichever matrix leg finishes FIRST, and the
# extension's update check reads `…/releases` immediately — so a published-while-uploading
# release offers links that answer 404 honestly. Measured twice: `mcp-v0.16.0` (tag burned) and
# `mcp-v0.18.13`, where an operator pressed Install and got a 404 on an asset uploaded seconds
# later. A draft is invisible to `GET /releases`, so the window does not exist.
on:
  push:
    tags:
      - 'mcp-v*'
      - 'extension-v*'
      - 'server-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to release'
        required: true
        type: choice
        # `server` is deliberately NOT here: an image is a released artefact, and releases start
        # from a `server-v*` tag cut on main. A dispatch build would publish one from a branch.
        options: [mcp, extension]

permissions:
  contents: read

# One run per tag. The draft job checks for an existing release and then creates one, and
# those two steps are not atomic: two runs of the same tag could both see nothing and both
# create a draft, which is the failure this whole shape exists to prevent. A tag is normally
# pushed once, so this costs nothing and closes the re-run case. Never `cancel-in-progress`:
# cancelling a release halfway is how a draft ends up half-uploaded with nobody watching.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # ONE job creates the draft, before any matrix leg runs.
  #
  # It was six legs racing a `gh release create --draft`, five expected to lose. **They do not
  # lose.** Measured against the live API on 2026-09-08, with a real existing tag:
  #
  #   gh release create <tag> --draft   ->  releases/tag/untagged-4edbbf29...   exit 0
  #   gh release create <tag> --draft   ->  releases/tag/untagged-ebd3e8b4...   exit 0
  #
  # A draft carries no tag of its own yet, so GitHub happily makes a second one under the same
  # name. Six legs would therefore produce six drafts holding one asset each, and the completeness
  # job would resolve one of them, find one archive, and fail. The `|| true` that made the old
  # published-release race safe is exactly what would have hidden this one.
  #
  # (What was NOT the problem, also measured: `gh release upload <tag>` resolves a DRAFT by tag
  # perfectly well - `isDraft: true`, asset present. The plan round raised that as blocking, and it
  # is simply not so.)
  mcp-draft:
    name: the mcp release, as a draft
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create it, once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          .github/scripts/draft-release.sh "$GITHUB_REF_NAME"
          "coai-mcp ${GITHUB_REF_NAME#mcp-v}"
          "Native AOT builds of the ConnectOtherAIs MCP server."


  server-draft:
    name: the server release, as a draft
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create it, once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: >-
          .github/scripts/draft-release.sh "$GITHUB_REF_NAME"
          "coai-server ${GITHUB_REF_NAME#server-v}"
          "Native AOT builds of the ConnectOtherAIs Team server, and the multi-arch image at ghcr.io/${{ github.repository_owner }}/coai-server:${GITHUB_REF_NAME#server-v}."


  mcp-binaries:
    name: coai-mcp (${{ matrix.rid }})
    # `always()` because of what a SKIPPED dependency does. `mcp-draft` is tag-only, so a
    # workflow_dispatch build skips it — and GitHub skips a job whose needed job was skipped,
    # whatever this job's own `if` says. That silently turned the manual build path into a run
    # that produced nothing. Five reviewers caught it on the code round. So: run for a tag once
    # the draft succeeded, run for a dispatch regardless, and never run after a cancel.
    if: >-
      always() && !cancelled()
      && ((startsWith(github.ref, 'refs/tags/mcp-v') && needs.mcp-draft.result == 'success')
          || inputs.target == 'mcp')
    # A leg no longer CREATES anything: `mcp-draft` did that once, and six legs racing a create
    # made six drafts rather than five clean failures.
    needs: [mcp-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          # macOS needs no toolchain step: Native AOT uses the Xcode command line tools,
          # which the runners already carry. It cannot be cross-compiled from LINUX, which is
          # why macOS gets its own runner at all.
          #
          # Both slices are built on the SAME arm64 runner. `macos-13` was the x64 runner and
          # GitHub retired it: a job targeting it does not fail, it QUEUES — the mcp-v0.10.0
          # release sat with five of six RIDs done and this one waiting for a machine that no
          # longer exists. Xcode on the arm64 runner carries the x86_64 slice, so `-r osx-x64`
          # cross-compiles there; the only thing lost is running the tests on x64 hardware,
          # which is why the test step below skips a cross-built RID rather than pretending.
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Never ship a binary that has not passed its own tests on this architecture — except the
      # one RID that is cross-built, where the runner cannot execute what it produced. Saying
      # that out loud beats a green step that ran the host's tests and called them the target's.
      - name: Build and test
        shell: bash
        run: |
          dotnet build dew_flow_connect_other_ais.slnx -c Release
          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            echo "osx-x64 is cross-built on an arm64 runner; its tests run in the osx-arm64 job."
          else
            ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
          fi

      # The version is derived ONCE, before the publish, because the binary is stamped with it and
      # the smoke step then asserts the binary says the same thing. It used to be computed inside
      # the packaging step only, which named the asset correctly while the binary inside it still
      # reported the SDK's default — the extension had no way to ask a file what it was.
      - name: The version this release stamps
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mcp-v* ]]; then VERSION="${GITHUB_REF_NAME#mcp-v}"; else VERSION="0.0.0-manual"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: dotnet publish src_mcp/src/CoaiMcp.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o out

      # The release smoke the epic demands: the PUBLISHED binary answers a real initialize /
      # tools/list exchange — the contract tests, pointed at it. AOT failures often surface only
      # at first run, and --help alone would not catch a broken tool surface.
      # The cross-built osx-x64 binary may not be runnable here at all (an arm64 runner without
      # Rosetta answers "Bad CPU type in executable"). That is the ONE failure allowed to skip
      # the smoke, and it is matched by its message: any other failure still fails the job,
      # because "it would not run" is exactly what this step exists to catch.
      #
      # OBSERVED on mcp-v0.10.0: the skip did NOT fire. Rosetta is present on macos-latest, so
      # the x64 binary ran and the contract tests — an arm64 runner pointed at COAI_CONTRACT_EXE
      # — exercised it over real stdio. The published x64 asset is therefore smoke-tested, not
      # merely built. Keep the branch anyway: it is the difference between a release that
      # degrades when Rosetta goes away and one that fails at the last step for a reason nobody
      # will recognise.
      - name: Smoke the published binary
        shell: bash
        env:
          COAI_CONTRACT_EXE: ${{ github.workspace }}/out/coai-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          EXE=./out/coai-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
          # FIRST: make it open a database. --help and a tools/list exchange never touch SQLite, so
          # a binary shipped without its native library passed both and failed at the one thing the
          # database exists for. An empty file is a valid empty database, so this loads the library
          # and reads through it — the exact path that was broken.
          DB=$(mktemp -d)
          : > "$DB/coai.db"
          if ! COAI_DATA_DIR="$DB" "$EXE" --log > /dev/null 2>"$DB/err"; then
            if [ "${{ matrix.rid }}" = "osx-x64" ] && grep -q 'Bad CPU type' "$DB/err"; then
              echo "osx-x64 cannot be executed on this arm64 runner; the database smoke is skipped with the rest."
            else
              echo "the published binary cannot open a database:"
              cat "$DB/err"
              exit 1
            fi
          # A ZERO exit is not enough any more, and this is the review gate's catch on this very
          # change: `--log` now answers a MISSING library with an empty log, a note on stderr and
          # exit 0 — so the graceful failure defeated the check added to catch it. The exit code
          # cannot distinguish them; the message can.
          #
          # Not "stderr is empty" either: a run against an EMPTY database legitimately prints
          # `no such table: findings` and exits 0, which is SQLite answering through the loaded
          # library — exactly what this smoke wants to see. Measured before writing the condition.
          elif grep -q 'is not beside the executable' "$DB/err"; then
            echo "the published binary could not load the SQLite library:"
            cat "$DB/err"
            exit 1
          fi
          if ! OUT=$("$EXE" --help 2>&1); then
            if [ "${{ matrix.rid }}" = "osx-x64" ] && printf '%s' "$OUT" | grep -q 'Bad CPU type'; then
              echo "osx-x64 cannot be executed on this arm64 runner; smoke skipped for this RID."
              exit 0
            fi
            echo "$OUT"
            exit 1
          fi
          printf '%s' "$OUT" | grep -q 'coai-mcp'

          # The binary must report the version this release is stamping. The extension's panel asks
          # a file what it is instead of remembering what it downloaded (a record VS Code shares
          # between a local and a WSL window, which is how a 0.12.1 in WSL was reported as 0.12.2),
          # so a stamping step that silently stops working would put that lie back — one release
          # later, in a place nobody would look. It fails HERE instead.
          # `tr -d CR`: WriteLine ends a line with CRLF on Windows, and a comparison against a
          # value from the environment would fail on the two Windows RIDs and nowhere else.
          REPORTED=$("$EXE" --version | tr -d '\r')
          if [ "$REPORTED" != "coai-mcp $VERSION" ]; then
            echo "the published binary reports '$REPORTED' but this release is 'coai-mcp $VERSION'"
            exit 1
          fi

          ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests${{ runner.os == 'Windows' && '.exe' || '' }} --filter-class "*McpContractTests"

      # The binary AND the native library it dlopens. Native AOT compiles managed code; a P/Invoke
      # into SQLite still resolves at run time through the OS loader, which searches the directory
      # the executable sits in. Shipping the executable alone produced a server that started,
      # answered --version and --help, passed the contract smoke — and threw DllNotFoundException
      # the first time anything touched the rounds database, where the write is best-effort and the
      # failure was therefore silent. Found on 0.18.1, in the installed build, by running it.
      - name: Package
        shell: bash
        run: |
          NAME="coai-mcp-$VERSION-${{ matrix.rid }}"
          mkdir "$NAME"
          NATIVE=$(ls out/*e_sqlite3* 2>/dev/null | head -1)
          if [ -z "$NATIVE" ]; then
            echo "the SQLite native library is not in the publish output — the server would ship unable to open its own database"
            ls -la out
            exit 1
          fi
          cp "$NATIVE" "$NAME/"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            cp out/coai-mcp.exe "$NAME/"
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
            LISTING=$(7z l "$NAME.zip")
          else
            cp out/coai-mcp "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
            LISTING=$(tar tzf "$NAME.tar.gz")
          fi
          # The ARCHIVE, not the directory it was made from. Checking the publish output proves the
          # library was BUILT; what ships is this file, and an include filter or a copy that silently
          # did nothing sits between the two. Raised by the review gate, and it is right: the check
          # that reproduces the incident is the one performed on the artifact itself.
          # At the archive's TOP LEVEL, beside the binary — the only place the OS loader looks. A
          # library nested in a subdirectory would satisfy a bare name match and still ship a server
          # that cannot open its database.
          #
          # Separators are normalised first, because the two listings do not agree: `tar tzf` prints
          # `NAME/lib...` at the start of a line, while `7z l` prints a table whose last column is
          # `NAME\e_sqlite3.dll` AFTER whitespace. The first version of this check allowed only a
          # line start or a separator before NAME, so it passed on tar and failed on both windows
          # RIDs - a release blocked at its last step. The review gate raised it; a test holds it now.
          if ! printf '%s' "$LISTING" | tr '\134' '/' | grep -Eq "(^|[[:space:]/])$NAME/[^/]*e_sqlite3"; then
            echo "the archive does not carry the SQLite library beside the binary — the shipped server could not open its own database"
            printf '%s' "$LISTING"
            exit 1
          fi

      # A checksum beside each archive, written by the job that BUILT it — four small files have
      # no collector job to fail (the reasoning is spelled out in creds' release.yml).
      - name: Checksum
        shell: bash
        run: sha256sum "$ASSET" > "$ASSET.sha256"

      # A DRAFT, and that is the fix for a real 404. A release created here is created by whichever
      # matrix leg finishes FIRST, and the extension's update check reads `…/releases` immediately —
      # so for the whole length of the matrix the release used to be published, visible, and missing
      # five of its six assets. Measured 2026-09-08: an operator pressed Install and got a 404 on
      # `coai-mcp-0.18.13-win-x64.zip`, which was uploaded at 17:31:54Z, after the click. Every link
      # it offered in that window answered 404 honestly.
      #
      # A draft is invisible to `GET /releases` for anyone but a writer, so there is no window at
      # all. `mcp-release-complete` publishes it once every expected asset is there — and a matrix
      # leg cannot make that decision, because it cannot see its five siblings.
      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          gh release upload "$GITHUB_REF_NAME" "$ASSET.sha256" --clobber

  # The check the mcp line never had, and the line that has now shipped incomplete TWICE:
  # `mcp-v0.16.0` (no win-x64, the tag was burned) and `mcp-v0.18.13` (no win-arm64, one leg's test
  # timed out on that runner alone). Both were found by a person pressing Install, not by CI.
  #
  # It is also the publish. Until it runs the release is a draft — invisible to `GET /releases`, so
  # the extension's update check cannot offer a download from a release that is still uploading.
  mcp-release-complete:
    name: the mcp release carries every platform
    if: startsWith(github.ref, 'refs/tags/mcp-v')
    needs: [mcp-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify every expected asset, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/verify-and-publish-release.sh mcp "$GITHUB_REF_NAME"


  extension:
    name: extension
    if: startsWith(github.ref, 'refs/tags/extension-v') || inputs.target == 'extension'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src_vs_code
    steps:
      - uses: actions/checkout@v7

      # The suite this job runs includes a test that compares the MOUNTED shared rule with the
      # snippet the menu hands out, so it needs the submodule on disk — and it fails rather than
      # skips without it, deliberately. CI and the Sonar job both do this; the release did not, and
      # the first tag after that test landed could not be built (extension-v0.29.13, 2026-09-05).
      - name: Conventions submodule
        working-directory: .
        run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src_vs_code/package-lock.json

      - name: Shared instruction dependencies and pin verification
        working-directory: .
        run: |
          npm ci --ignore-scripts --prefix .agents/conventions
          node .agents/conventions/tools/rules.mjs check --repo .

      - run: npm ci

      # The manifest version IS the release version; a tag that disagrees with it would publish
      # a lie. Refuse rather than reconcile.
      - name: Version must match the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#extension-v}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/extension-v* && "$TAG" != "$MANIFEST" ]]; then
            echo "tag says $TAG, package.json says $MANIFEST — fix one of them" >&2
            exit 1
          fi

      # Never ship an extension that has not passed its own tests.
      - run: npm test

      - run: npm run bundle

      - name: Package
        run: npx @vscode/vsce package --no-dependencies

      # Drafted and published in one step, because this line is ONE job producing ONE asset — there
      # are no siblings to wait for and nothing a separate job could see that this one cannot. The
      # draft still earns its place: the window between create and upload is small, and "small" is
      # what the mcp line's window was called before it cost a release.
      - name: Attach to the release, then publish it
        if: startsWith(github.ref, 'refs/tags/extension-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # No `|| true`. It hid a permission failure, an API failure and a malformed release alike,
          # and the job then uploaded into a state nobody had established. Reused only when it is
          # still a DRAFT, exactly as the two matrix lines do it.
          if EXISTING=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null); then
            [ "$EXISTING" = "true" ] \
              || { echo "$GITHUB_REF_NAME is already PUBLISHED — refusing to upload into a visible release"; exit 1; }
            echo "$GITHUB_REF_NAME is already a draft; reusing it"
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "ConnectOtherAIs ${GITHUB_REF_NAME#extension-v}" \
              --notes "The VS Code extension."
          fi

          gh release upload "$GITHUB_REF_NAME" *.vsix --clobber

          # Asked of the RELEASE, not assumed from an exit code. `set -e` catches an upload that
          # fails; it does not catch one that uploaded something other than a .vsix, and this line
          # is the same guarantee the other two lines get from their completeness job. Raised on
          # the plan round: an unconditional publish here would have broken the promise that
          # nothing is visible until its asset is.
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -q '\.vsix$' \
            || { echo "no .vsix on the release — refusing to publish an empty one"; exit 1; }

          gh release edit "$GITHUB_REF_NAME" --draft=false

      # Publishing needs a Marketplace PAT (https://dev.azure.com → Personal Access Tokens,
      # scope "Marketplace: Manage") stored as the VSCE_PAT repository secret. Absent, this step
      # says so and the .vsix on the release is uploaded by hand — never a silent success.
      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/extension-v')
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::warning::VSCE_PAT is not set — the .vsix is on the GitHub release; upload it to the Marketplace by hand or add the secret."
            exit 0
          fi
          npx @vscode/vsce publish --no-dependencies --packagePath *.vsix -p "$VSCE_PAT"

  # ---------------------------------------------------------------------------
  # The Team server, as six Native AOT binaries.
  #
  # The images below are what a CONTAINER deployment consumes. `coai.remsoft.dev` is not one: it
  # runs the AOT binary under systemd, because the three vendor CLIs are already installed on that
  # host and an image that installed its own copies would add ~750 MB to duplicate them
  # (deploy/README.md). So the artefact the real deployment uses was, until this job existed, the
  # one thing a `server-v*` tag did not produce — and 0.5.5 reached the internet as a binary built
  # by hand on the host, from a commit no tag names, in a directory called `0.5.5-STAMP`.
  #
  # A sibling of `mcp-binaries` above, deliberately: the six-RID matrix, the retired-x64-runner
  # story, the Linux toolchain step and the stamp-then-assert discipline were all solved there.
  # ---------------------------------------------------------------------------
  server-binaries:
    name: coai-server (${{ matrix.rid }})
    # As the mcp matrix: a skipped `server-draft` would otherwise skip this whole job. The server
    # line has no dispatch target today, and the condition is written the same way so that adding
    # one cannot resurrect the defect.
    if: >-
      always() && !cancelled()
      && startsWith(github.ref, 'refs/tags/server-v') && needs.server-draft.result == 'success'
    needs: [server-draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          # Both macOS slices on the same arm64 runner, for the reason spelled out in the mcp
          # matrix: `macos-13` was retired and a job targeting it QUEUES rather than fails.
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    # A bound on the whole leg, not only on the poll inside it. The smoke's own deadline covers a
    # server that never binds; this covers the rest — a link that hangs, a runner that stalls, a
    # process that ignores its termination. Without it the ceiling is the workflow default of six
    # hours, which is a release nobody watches finish.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # The server's own suite, on this architecture, before its binary is published — the same
      # rule the mcp job states: never ship a binary that has not passed its own tests here.
      - name: Build and test
        shell: bash
        run: |
          dotnet build dew_flow_connect_other_ais.slnx -c Release
          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            echo "osx-x64 is cross-built on an arm64 runner; its tests run in the osx-arm64 job."
          else
            ./src_server/tests/bin/Release/net10.0/CoaiServer.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
          fi

      - name: The version this release stamps
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: dotnet publish src_server/src/CoaiServer.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o out

      # The smoke, and the one step of this job that is NOT the mcp job's.
      #
      # `coai-mcp` answers `--version` on stdout. The server has no argument surface at all: it
      # answers `/api/health` with `{ok, version}` (src_server/src/Program.cs), from the assembly's
      # informational version. So the only way to ask this binary what it is, is to RUN it — which
      # makes every failure mode a wait rather than an exit code, and that is what the deadline,
      # the captured log and the unconditional kill below are for.
      #
      # The three settings are exactly what `Startup.Guard` demands: an authentication scheme and a
      # domain boundary. `Auth:Local` is the scheme that needs no tenant, and the guard REFUSES it
      # beside a real provider — so this configuration cannot silently weaken a real one.
      - name: Smoke the published binary
        id: smoke
        shell: bash
        run: |
          set -uo pipefail
          EXE=./out/coai-server${{ runner.os == 'Windows' && '.exe' || '' }}
          LOG="$RUNNER_TEMP/server.log"
          DATA="$RUNNER_TEMP/data"
          mkdir -p "$DATA"

          Coai__DataDir="$DATA" \
          Coai__AllowedDomains=example.test \
          Coai__RequireForwardedHttps=false \
          Auth__Local__SigningKey=smoke-only-key-that-is-long-enough-32 \
          ASPNETCORE_URLS=http://127.0.0.1:5099 \
            "$EXE" >"$LOG" 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"

          # A cross-built binary cannot run here at all, and the message that says so is the ONE
          # failure allowed to skip. It is checked FIRST, before any polling: the mcp smoke runs a
          # command that exits, so it could test the message afterwards. Polling a process that
          # never started would burn the whole deadline and then report "the server did not bind",
          # which names the wrong problem.
          sleep 2
          if grep -q 'Bad CPU type' "$LOG" 2>/dev/null; then
            echo "osx-x64 cannot be executed on this arm64 runner; smoke skipped for this RID."
            exit 0
          fi

          # An ABSOLUTE deadline, not a loop count. Sixty iterations of `--max-time 2` plus a
          # one-second sleep is up to 180 seconds while the failure message says sixty — a bound
          # that lies about itself by a factor of three, on six legs at once. Raised on the code
          # round, and it is the kind of thing only arithmetic catches.
          DEADLINE=60
          UNTIL=$(( $(date +%s) + DEADLINE ))
          HEALTH=""
          while [ "$(date +%s)" -lt "$UNTIL" ]; do
            HEALTH=$(curl -fsS --max-time 2 http://127.0.0.1:5099/api/health 2>/dev/null || true)
            [ -n "$HEALTH" ] && break
            sleep 2
          done

          if [ -z "$HEALTH" ]; then
            echo "the published binary did not answer /api/health within ${DEADLINE}s — its output follows"
            cat "$LOG"
            exit 1
          fi

          # The binary must report the version this release is stamping, for the reason the mcp job
          # gives: the panel asks a file what it is instead of remembering what it downloaded, so a
          # stamping step that silently stopped working would put that lie back one release later.
          if ! printf '%s' "$HEALTH" | grep -q "\"version\":\"$VERSION\""; then
            echo "the published binary reports $HEALTH but this release is 'coai-server $VERSION'"
            cat "$LOG"
            exit 1
          fi
          echo "healthy: $HEALTH"

      # Unconditional, because the failure this exists for is a server that IGNORES its
      # termination: a job that leaks the process can hold its runner until the workflow timeout.
      - name: Stop the smoked server
        if: always()
        shell: bash
        run: |
          PID="${PID:-0}"
          kill "$PID" 2>/dev/null || true
          # And then insist. A server that ignores SIGTERM is one of the failure modes this whole
          # step exists for, and leaving it holding port 5099 on a runner that a re-run may reuse
          # turns one broken build into two. Raised on the code round.
          sleep 2
          kill -9 "$PID" 2>/dev/null || true

      # The binary AND every `appsettings*.json` the publish emitted. The server reads its Serilog
      # levels and its rate-limit defaults from those files, so a binary shipped alone starts with
      # different behaviour than the one that was just smoked — and `Production` overrides, if this
      # project ever grows them, are exactly the ones a deployment needs.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          NAME="coai-server-$VERSION-${{ matrix.rid }}"
          mkdir "$NAME"
          BIN=coai-server${{ runner.os == 'Windows' && '.exe' || '' }}
          cp "out/$BIN" "$NAME/"
          SETTINGS=$(ls out/appsettings*.json 2>/dev/null || true)
          if [ -z "$SETTINGS" ]; then
            echo "the publish output carries no appsettings*.json — the shipped server would start on defaults nobody tested"
            ls -la out
            exit 1
          fi
          cp out/appsettings*.json "$NAME/"

          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
            LISTING=$(7z l "$NAME.zip")
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
            LISTING=$(tar tzf "$NAME.tar.gz")
          fi

          # The ARCHIVE, not the directory it was made from — the same lesson the mcp job records
          # about its native library: checking the publish output proves a file was BUILT, and what
          # ships is this file, with a copy that silently did nothing sitting between the two.
          # Separators normalised because `tar tzf` and `7z l` do not print the same shape.
          if ! printf '%s' "$LISTING" | tr '\134' '/' | grep -Eq "(^|[[:space:]/])$NAME/appsettings"; then
            echo "the archive does not carry appsettings beside the binary"
            printf '%s' "$LISTING"
            exit 1
          fi

      - name: Checksum
        shell: bash
        run: sha256sum "$ASSET" > "$ASSET.sha256"

      # Six matrix legs race to create ONE release, so the create is expected to fail five times —
      # and `|| true` would swallow every OTHER failure with it, which is how a release ends up
      # with five archives and a green run. Tolerated only when `gh release view` then finds it.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          gh release upload "$GITHUB_REF_NAME" "$ASSET.sha256" --clobber

  # A release with five archives and a swallowed error looks exactly like one with six from inside
  # any single matrix leg. This job is the only place that can see all of them.
  #
  # It needs `server-binaries` and NOT `server-manifest`, deliberately. The two artefacts have
  # independent lifecycles — a container registry outage has nothing to do with whether the binary
  # the live host installs is complete — and coupling them means a failed image job leaves the
  # deployment shape that IS used with no completeness signal at all. Raised by three reviewers.
  server-release-complete:
    name: the server release carries every platform
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: [server-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # WRITE, because this job PUBLISHES now. It was `read` when it only counted the assets, and
      # the publish would have failed silently on every server release — `gh release edit` refused,
      # then the script's own verification reported a complete release as unpublishable. Found on
      # the code round by reading the permissions beside what the job actually does.
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify every expected asset, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/verify-and-publish-release.sh server "$GITHUB_REF_NAME"


  server-image-amd64:
    name: coai-server image (amd64)
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # The repository ROOT: central package management, the SDK pin and the feed list
          # live there, and a build that cannot see them resolves different versions than CI.
          context: .
          file: src_server/Dockerfile
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coai-server
          outputs: type=image,push-by-digest=true,name-canonical=true
          # NO cache for the CLI layers is possible in a useful sense — the installers fetch
          # whatever is current, so a cached layer would pin the very thing the operator
          # decided not to pin. The .NET restore and publish layers cache normally.
          cache-from: type=gha,scope=server-amd64
          cache-to: type=gha,mode=max,scope=server-amd64

  server-image-arm64:
    name: coai-server image (arm64)
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: src_server/Dockerfile
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coai-server
          outputs: type=image,push-by-digest=true,name-canonical=true
          cache-from: type=gha,scope=server-arm64
          cache-to: type=gha,mode=max,scope=server-arm64

  server-manifest:
    name: publish coai-server manifest
    needs: [server-image-amd64, server-image-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch and tag
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/${{ github.repository_owner }}/coai-server
          VERSION="${GITHUB_REF_NAME#server-v}"
          AMD64="${{ needs.server-image-amd64.outputs.digest }}"
          ARM64="${{ needs.server-image-arm64.outputs.digest }}"
          # An empty digest here used to be possible and produced a confusing `invalid reference`
          # from buildx. Say which one is missing instead.
          [ -n "$AMD64" ] || { echo "amd64 digest is empty" >&2; exit 1; }
          [ -n "$ARM64" ] || { echo "arm64 digest is empty" >&2; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE@$AMD64" \
            "$IMAGE@$ARM64"
