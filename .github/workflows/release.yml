name: release

# Two products, two tag shapes, so releasing one never ships the other:
#   mcp-v0.2.3       → four Native AOT `coai-mcp` binaries attached to the release
#   extension-v0.8.0 → the .vsix, attached to the release AND published to the Marketplace
#                      when the VSCE_PAT secret exists (without it, the publish step skips
#                      OUT LOUD and the .vsix still lands on the release for a manual upload).
#   server-v0.5.1    → a multi-arch `coai-server` image on ghcr.io. The Team server, which is
#                      deployed rather than downloaded, so there is nothing to attach to a
#                      release — the artefact IS the image.
# (The guard-without-a-trigger trap is documented in creds' release.yml — a job's `if` is not a
# workflow trigger, so every tag shape is listed here.)
on:
  push:
    tags:
      - 'mcp-v*'
      - 'extension-v*'
      - 'server-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to release'
        required: true
        type: choice
        options: [mcp, extension, server]

permissions:
  contents: read

jobs:
  mcp-binaries:
    name: coai-mcp (${{ matrix.rid }})
    if: startsWith(github.ref, 'refs/tags/mcp-v') || inputs.target == 'mcp'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
          # macOS needs no toolchain step: Native AOT uses the Xcode command line tools,
          # which the runners already carry. It cannot be cross-compiled from LINUX, which is
          # why macOS gets its own runner at all.
          #
          # Both slices are built on the SAME arm64 runner. `macos-13` was the x64 runner and
          # GitHub retired it: a job targeting it does not fail, it QUEUES — the mcp-v0.10.0
          # release sat with five of six RIDs done and this one waiting for a machine that no
          # longer exists. Xcode on the arm64 runner carries the x86_64 slice, so `-r osx-x64`
          # cross-compiles there; the only thing lost is running the tests on x64 hardware,
          # which is why the test step below skips a cross-built RID rather than pretending.
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Toolchain (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      # Never ship a binary that has not passed its own tests on this architecture — except the
      # one RID that is cross-built, where the runner cannot execute what it produced. Saying
      # that out loud beats a green step that ran the host's tests and called them the target's.
      - name: Build and test
        shell: bash
        run: |
          dotnet build dew_flow_connect_other_ais.slnx -c Release
          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            echo "osx-x64 is cross-built on an arm64 runner; its tests run in the osx-arm64 job."
          else
            ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
          fi

      # The version is derived ONCE, before the publish, because the binary is stamped with it and
      # the smoke step then asserts the binary says the same thing. It used to be computed inside
      # the packaging step only, which named the asset correctly while the binary inside it still
      # reported the SDK's default — the extension had no way to ask a file what it was.
      - name: The version this release stamps
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/mcp-v* ]]; then VERSION="${GITHUB_REF_NAME#mcp-v}"; else VERSION="0.0.0-manual"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: dotnet publish src_mcp/src/CoaiMcp.csproj -c Release -r ${{ matrix.rid }} -p:Version=$VERSION -o out

      # The release smoke the epic demands: the PUBLISHED binary answers a real initialize /
      # tools/list exchange — the contract tests, pointed at it. AOT failures often surface only
      # at first run, and --help alone would not catch a broken tool surface.
      # The cross-built osx-x64 binary may not be runnable here at all (an arm64 runner without
      # Rosetta answers "Bad CPU type in executable"). That is the ONE failure allowed to skip
      # the smoke, and it is matched by its message: any other failure still fails the job,
      # because "it would not run" is exactly what this step exists to catch.
      #
      # OBSERVED on mcp-v0.10.0: the skip did NOT fire. Rosetta is present on macos-latest, so
      # the x64 binary ran and the contract tests — an arm64 runner pointed at COAI_CONTRACT_EXE
      # — exercised it over real stdio. The published x64 asset is therefore smoke-tested, not
      # merely built. Keep the branch anyway: it is the difference between a release that
      # degrades when Rosetta goes away and one that fails at the last step for a reason nobody
      # will recognise.
      - name: Smoke the published binary
        shell: bash
        env:
          COAI_CONTRACT_EXE: ${{ github.workspace }}/out/coai-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          EXE=./out/coai-mcp${{ runner.os == 'Windows' && '.exe' || '' }}
          # FIRST: make it open a database. --help and a tools/list exchange never touch SQLite, so
          # a binary shipped without its native library passed both and failed at the one thing the
          # database exists for. An empty file is a valid empty database, so this loads the library
          # and reads through it — the exact path that was broken.
          DB=$(mktemp -d)
          : > "$DB/coai.db"
          if ! COAI_DATA_DIR="$DB" "$EXE" --log > /dev/null 2>"$DB/err"; then
            if [ "${{ matrix.rid }}" = "osx-x64" ] && grep -q 'Bad CPU type' "$DB/err"; then
              echo "osx-x64 cannot be executed on this arm64 runner; the database smoke is skipped with the rest."
            else
              echo "the published binary cannot open a database:"
              cat "$DB/err"
              exit 1
            fi
          # A ZERO exit is not enough any more, and this is the review gate's catch on this very
          # change: `--log` now answers a MISSING library with an empty log, a note on stderr and
          # exit 0 — so the graceful failure defeated the check added to catch it. The exit code
          # cannot distinguish them; the message can.
          #
          # Not "stderr is empty" either: a run against an EMPTY database legitimately prints
          # `no such table: findings` and exits 0, which is SQLite answering through the loaded
          # library — exactly what this smoke wants to see. Measured before writing the condition.
          elif grep -q 'is not beside the executable' "$DB/err"; then
            echo "the published binary could not load the SQLite library:"
            cat "$DB/err"
            exit 1
          fi
          if ! OUT=$("$EXE" --help 2>&1); then
            if [ "${{ matrix.rid }}" = "osx-x64" ] && printf '%s' "$OUT" | grep -q 'Bad CPU type'; then
              echo "osx-x64 cannot be executed on this arm64 runner; smoke skipped for this RID."
              exit 0
            fi
            echo "$OUT"
            exit 1
          fi
          printf '%s' "$OUT" | grep -q 'coai-mcp'

          # The binary must report the version this release is stamping. The extension's panel asks
          # a file what it is instead of remembering what it downloaded (a record VS Code shares
          # between a local and a WSL window, which is how a 0.12.1 in WSL was reported as 0.12.2),
          # so a stamping step that silently stops working would put that lie back — one release
          # later, in a place nobody would look. It fails HERE instead.
          # `tr -d CR`: WriteLine ends a line with CRLF on Windows, and a comparison against a
          # value from the environment would fail on the two Windows RIDs and nowhere else.
          REPORTED=$("$EXE" --version | tr -d '\r')
          if [ "$REPORTED" != "coai-mcp $VERSION" ]; then
            echo "the published binary reports '$REPORTED' but this release is 'coai-mcp $VERSION'"
            exit 1
          fi

          ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests${{ runner.os == 'Windows' && '.exe' || '' }} --filter-class "*McpContractTests"

      # The binary AND the native library it dlopens. Native AOT compiles managed code; a P/Invoke
      # into SQLite still resolves at run time through the OS loader, which searches the directory
      # the executable sits in. Shipping the executable alone produced a server that started,
      # answered --version and --help, passed the contract smoke — and threw DllNotFoundException
      # the first time anything touched the rounds database, where the write is best-effort and the
      # failure was therefore silent. Found on 0.18.1, in the installed build, by running it.
      - name: Package
        shell: bash
        run: |
          NAME="coai-mcp-$VERSION-${{ matrix.rid }}"
          mkdir "$NAME"
          NATIVE=$(ls out/*e_sqlite3* 2>/dev/null | head -1)
          if [ -z "$NATIVE" ]; then
            echo "the SQLite native library is not in the publish output — the server would ship unable to open its own database"
            ls -la out
            exit 1
          fi
          cp "$NATIVE" "$NAME/"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            cp out/coai-mcp.exe "$NAME/"
            7z a "$NAME.zip" "$NAME" > /dev/null
            echo "ASSET=$NAME.zip" >> "$GITHUB_ENV"
            LISTING=$(7z l "$NAME.zip")
          else
            cp out/coai-mcp "$NAME/"
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=$NAME.tar.gz" >> "$GITHUB_ENV"
            LISTING=$(tar tzf "$NAME.tar.gz")
          fi
          # The ARCHIVE, not the directory it was made from. Checking the publish output proves the
          # library was BUILT; what ships is this file, and an include filter or a copy that silently
          # did nothing sits between the two. Raised by the review gate, and it is right: the check
          # that reproduces the incident is the one performed on the artifact itself.
          # At the archive's TOP LEVEL, beside the binary — the only place the OS loader looks. A
          # library nested in a subdirectory would satisfy a bare name match and still ship a server
          # that cannot open its database.
          #
          # Separators are normalised first, because the two listings do not agree: `tar tzf` prints
          # `NAME/lib...` at the start of a line, while `7z l` prints a table whose last column is
          # `NAME\e_sqlite3.dll` AFTER whitespace. The first version of this check allowed only a
          # line start or a separator before NAME, so it passed on tar and failed on both windows
          # RIDs - a release blocked at its last step. The review gate raised it; a test holds it now.
          if ! printf '%s' "$LISTING" | tr '\134' '/' | grep -Eq "(^|[[:space:]/])$NAME/[^/]*e_sqlite3"; then
            echo "the archive does not carry the SQLite library beside the binary — the shipped server could not open its own database"
            printf '%s' "$LISTING"
            exit 1
          fi

      # A checksum beside each archive, written by the job that BUILT it — four small files have
      # no collector job to fail (the reasoning is spelled out in creds' release.yml).
      - name: Checksum
        shell: bash
        run: sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --title "coai-mcp ${GITHUB_REF_NAME#mcp-v}" --notes "Native AOT builds of the ConnectOtherAIs MCP server." 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          gh release upload "$GITHUB_REF_NAME" "$ASSET.sha256" --clobber

  extension:
    name: extension
    if: startsWith(github.ref, 'refs/tags/extension-v') || inputs.target == 'extension'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: src_vs_code
    steps:
      - uses: actions/checkout@v7

      # The suite this job runs includes a test that compares the MOUNTED shared rule with the
      # snippet the menu hands out, so it needs the submodule on disk — and it fails rather than
      # skips without it, deliberately. CI and the Sonar job both do this; the release did not, and
      # the first tag after that test landed could not be built (extension-v0.29.13, 2026-09-05).
      - name: Conventions submodule
        working-directory: .
        run: git submodule update --init --depth 1 .claude/rules/shared

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src_vs_code/package-lock.json

      - run: npm ci

      # The manifest version IS the release version; a tag that disagrees with it would publish
      # a lie. Refuse rather than reconcile.
      - name: Version must match the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#extension-v}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/extension-v* && "$TAG" != "$MANIFEST" ]]; then
            echo "tag says $TAG, package.json says $MANIFEST — fix one of them" >&2
            exit 1
          fi

      # Never ship an extension that has not passed its own tests.
      - run: npm test

      - run: npm run bundle

      - name: Package
        run: npx @vscode/vsce package --no-dependencies

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/extension-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --title "ConnectOtherAIs ${GITHUB_REF_NAME#extension-v}" --notes "The VS Code extension." 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" *.vsix --clobber

      # Publishing needs a Marketplace PAT (https://dev.azure.com → Personal Access Tokens,
      # scope "Marketplace: Manage") stored as the VSCE_PAT repository secret. Absent, this step
      # says so and the .vsix on the release is uploaded by hand — never a silent success.
      - name: Publish to the Marketplace
        if: startsWith(github.ref, 'refs/tags/extension-v')
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::warning::VSCE_PAT is not set — the .vsix is on the GitHub release; upload it to the Marketplace by hand or add the secret."
            exit 0
          fi
          npx @vscode/vsce publish --no-dependencies --packagePath *.vsix -p "$VSCE_PAT"

  # ---------------------------------------------------------------------------
  # The Team server, as a multi-arch image.
  #
  # One job per architecture on a NATIVE runner, then a manifest stitched from the two
  # digests. Native AOT does not cross-compile inside qemu — an arm64 image built on an
  # x64 runner under emulation either fails to link or takes long enough that it may as
  # well have. This is the same shape creds' release uses, for the same reason.
  # ---------------------------------------------------------------------------
  server-image:
    name: coai-server image (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/server-v') || inputs.target == 'server'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.export.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.export.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            echo "version=${GITHUB_REF_NAME#server-v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-manual" >> "$GITHUB_OUTPUT"
          fi

      - id: build
        uses: docker/build-push-action@v7
        with:
          # The repository ROOT: central package management, the SDK pin and the feed list
          # live there, and a build that cannot see them resolves different versions than CI.
          context: .
          file: src_server/Dockerfile
          build-args: VERSION=${{ steps.ver.outputs.version }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/coai-server
          outputs: type=image,push-by-digest=true,name-canonical=true
          # NO cache for the CLI layers is possible in a useful sense — the installers fetch
          # whatever is current, so a cached layer would pin the very thing the operator
          # decided not to pin. The .NET restore and publish layers cache normally.
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}

      - id: export
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  server-manifest:
    name: publish coai-server manifest
    needs: server-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch and tag
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/coai-server
          VERSION="${GITHUB_REF_NAME#server-v}"
          TAGS="-t $IMAGE:$VERSION"
          # `latest` moves only on a real tag, so an operator who pinned :latest never picks
          # up a workflow_dispatch trial build.
          if [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            TAGS="$TAGS -t $IMAGE:latest"
          else
            TAGS="-t $IMAGE:manual-$(date +%Y%m%d%H%M 2>/dev/null || echo run)"
          fi
          docker buildx imagetools create $TAGS \
            "$IMAGE@${{ needs.server-image.outputs.digest-amd64 }}" \
            "$IMAGE@${{ needs.server-image.outputs.digest-arm64 }}"
