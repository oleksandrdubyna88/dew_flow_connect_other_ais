name: sonarcloud

# SonarCloud analysis of the .NET halves (src_mcp, src_bench) with test coverage, on every push to
# main and every pull request. The scanner for .NET needs the build to happen between `begin` and
# `end`, a JDK, and — in this family — the tests run as the runner executables xUnit v3 / MTP
# builds, under dotnet-coverage: `dotnet test` has no VSTest host here and would abort, which is
# not a coverage report. The TypeScript extension is not in this analysis (the .NET scanner sees
# the files of the projects it builds); it is a follow-up with a scanner of its own.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # blame and new-code detection need the whole history
      # This job runs the extension's tests for their coverage, and one of them compares the shared
      # rule with the snippet the menu hands out — so it needs the rule on disk for the same reason
      # the CI job does. It fails rather than skips without it, deliberately.
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .claude/rules/shared
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Install the scanner and the coverage tool
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
      - name: Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"remsoftdev_dew_flow_connect_other_ais" \
            /o:"remsoftdev" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage/*.xml"             /d:sonar.javascript.lcov.reportPaths="coverage/extension.lcov"             /d:sonar.typescript.lcov.reportPaths="coverage/extension.lcov" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,artifacts/**,**/node_modules/**,src_mcp/tests_fakecli/**" \
            /d:sonar.coverage.exclusions="**/tests/**,**/*.Tests/**,src_mcp/tests_fakecli/**"
      - name: Build
        run: dotnet build dew_flow_connect_other_ais.slnx -c Release --no-incremental
      - name: Test with coverage
        run: |
          mkdir -p coverage
          dotnet-coverage collect -f xml -o coverage/server.xml -- ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests
          dotnet-coverage collect -f xml -o coverage/bench.xml -- ./src_bench/CoaiBench.Tests/bin/Release/net10.0/CoaiBench.Tests
      # The extension is TypeScript and the .NET scanner does not run its tests, so every change to
      # src_vs_code arrived at the gate as 0 % coverage of new code — a number about the analysis
      # rather than about the change. Node's own runner writes lcov.
      - name: The extension's coverage
        working-directory: src_vs_code
        run: |
          # --ignore-scripts: SonarCloud githubactions:S6505 — a lifecycle script runs as CI with the
          # token in the environment. esbuild ships its binary as an optional platform dependency
          # rather than a postinstall download, so the bundler the tests use still works without them.
          npm ci --ignore-scripts
          npm run compile
          mkdir -p ../coverage
          # Through c8 rather than node's own --experimental-test-coverage: node writes the paths of
          # the files it EXECUTED, which are out/*.js, while Sonar analyses src/*.ts — so every
          # extension change arrived at the gate as 0 % coverage of new code even when it shipped
          # with tests. c8 reads the same V8 data and applies the source maps, so the report names
          # the TypeScript. (Measured 2026-09-05 on PR #10: SF:out\cliVersions.js against
          # SF:src\cliVersions.ts.)
          # The installed binary, never npx: npx resolves and runs a package on demand, which is a
          # supply-chain hole in CI with a token in the environment (SonarCloud githubactions:S6505,
          # S8543). c8 is a declared dev dependency, so npm ci has already put it here at the version
          # the lock file pins.
          ./node_modules/.bin/c8 --reporter=lcovonly --report-dir=../coverage/c8 --src=src node --test "out/test/"*.test.js
          # c8 writes them relative to THIS folder, with the platform's separators; Sonar wants them
          # relative to the repository root.
          sed -e 's|^SF:|SF:src_vs_code/|' -e 's|\\|/|g' ../coverage/c8/lcov.info > ../coverage/extension.lcov
      - name: End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
