name: sonarcloud

# SonarCloud analysis of the .NET halves (src_mcp, src_bench) with test coverage, on every push to
# main and every pull request. The scanner for .NET needs the build to happen between `begin` and
# `end`, a JDK, and — in this family — the tests run as the runner executables xUnit v3 / MTP
# builds, under dotnet-coverage: `dotnet test` has no VSTest host here and would abort, which is
# not a coverage report. The TypeScript extension is not in this analysis (the .NET scanner sees
# the files of the projects it builds); it is a follow-up with a scanner of its own.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # blame and new-code detection need the whole history
      # This job runs the extension's tests for their coverage, and one of them compares the shared
      # rule with the snippet the menu hands out — so it needs the rule on disk for the same reason
      # the CI job does. It fails rather than skips without it, deliberately.
      - name: Conventions submodule
        run: git submodule update --init --depth 1 .agents/conventions
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Shared instruction dependencies and pin verification
        run: |
          npm ci --ignore-scripts --prefix .agents/conventions
          node .agents/conventions/tools/rules.mjs check --repo .
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install the scanner and the coverage tool
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage
      #   sonar.exclusions        + .agents/conventions/**
      #     A SUBMODULE. It is `dew_flow_conventions`, a separate repository with its own CI and its
      #     own Sonar project, mounted here so the shared rules travel with the checkout. Scanning it
      #     as this project's code was measured on 2026-09-21 and it is why `main`'s quality gate had
      #     stopped meaning anything: ERROR, `new_reliability_rating=4` and `new_security_rating=3`,
      #     from 32 new-code findings of which **17 were in the submodule** — path-traversal and PATH
      #     warnings on its CLI tools, `localeCompare` sort findings in its checkers. None of them is
      #     fixable from here. A gate that is permanently red reports nothing, so a real regression on
      #     `main` arrives invisible; story 3.3's own pull request passed at 1/1 while `main` was red
      #     the whole time. This is the ANALYSIS list rather than the coverage list on purpose: the
      #     claim is not "do not measure these", it is "these are not ours to judge".
      #
      # Two further additions, both about build scripts rather than shipped code,
      # and both worth knowing about because an exclusion is a decision to stop looking:
      #
      #   sonar.exclusions        + src_vs_code/scripts/**
      #     These launch the toolchain — `dotnet`, `node` — and S4036 fires on doing that at all
      #     ("make sure PATH contains only fixed, unwriteable directories"). For a script whose
      #     entire contract is to use the developer's toolchain, that is not a finding it can ever
      #     satisfy; the alternative is three hotspots marked safe by hand on every new script.
      #     Same rationale as the existing `src_mcp/tests_fakecli/**` entry. Note this stops
      #     analysing those files for real defects too — if they grow logic worth checking, the
      #     entry should come back out and the hotspots be reviewed instead.
      #
      #   sonar.coverage.exclusions + src_vs_code/src/test/**, src_vs_code/scripts/**
      #     Test code and tooling, which is what `**/tests/**` already does for the .NET half.
      #     Without it a pull request that adds a test suite fails the 80 % new-code coverage gate
      #     for having added tests.
      #
      #
      #   sonar.coverage.exclusions + src_mcp/tests_notices/**
      #     `NoticeTool`, the parity check's server half. It is DRIVEN by `run-parity.mjs`, which
      #     spawns it once per verb and compares its stdout against the extension's own serialiser
      #     over 346 generated shapes — so it is exercised harder than most of this repository and
      #     no coverage instrumentation can see a line of it, because it runs in a child process.
      #     Without this entry a pull request that adds it arrives at the gate as 0 % of the new
      #     code it contributed, which is a number about the analysis rather than about the change.
      #     Analysis stays ON — this is the coverage list, not `sonar.exclusions`, and the smells it
      #     reported on the first run were real and were fixed rather than excluded. `FakeCli` is in
      #     BOTH lists because its scripts launch the toolchain and S4036 fires on that; this one
      #     reads stdin and writes stdout, so there is nothing to excuse.
      #
      #   sonar.coverage.exclusions + .github/scripts/**
      #     The release scripts. They are tested HARDER than most of this repository — the suite
      #     SPAWNS them and asserts their exit codes, because what has to be true of a guard is that
      #     it refuses, and a guard that prints a complaint and exits 0 stops nothing in a workflow.
      #     No coverage instrumentation can see a child process, so a folder of them arrives at the
      #     gate as 0 % of the new code however many cases it gained. Analysis stays ON — this is
      #     the coverage list, not `sonar.exclusions`, so real defects in these files are still
      #     reported. If they
      #     ever grow logic worth executing in-process, import it from a module under `src` and let
      #     that be covered normally.
      #
      #   sonar.coverage.exclusions + the modules that CANNOT LOAD without `vscode`
      #     A module that imports `vscode` — or imports one that does, at any depth — cannot be
      #     loaded outside an extension host. `sonarExclusions.test.ts` asks that question
      #     transitively and fails when this list and the answer disagree, in EITHER direction, so
      #     the list is checked rather than trusted, which is why no count is written here: a number
      #     in a comment has nobody to keep it true, and this one had already drifted by the time
      #     anybody read it. The test knows how many there are; the comment says why they are here.
      #     There IS a harness now (`npm run test:host`, since 2026-09-17), and it does not change
      #     this: it runs a handful of named SCENARIOS in a real editor, not the unit suite,
      #     so Node's runner still never executes a line of these modules and they still arrive at
      #     the gate as 0 % of whatever they contributed to new code: a number about the
      #     analysis rather than about the change, which is the same reason the extension's lcov is
      #     produced at all and the same reason `coai-server` was added to the collection above.
      #     They are a MINORITY of `src`, and that split is deliberate rather than incidental: the
      #     decisions live in the modules that take no editor, which are tested as values and carry
      #     the coverage. A module here should hold wiring and nothing worth executing.
      #     What guards these instead is a source-read wiring test per feature (`chatWiring`,
      #     `chatGotoWiring`, `chatFreshWiring`, `conversationPickerWiring`, `chatSourceWiring`),
      #     which asserts which function each arm calls and that each dispatch is exhaustive.
      #     **The list is checked by `sonarExclusions.test.ts`**, which fails when it stops matching
      #     the set of files that import `vscode` — so a new host module cannot be quietly left out
      #     and one that sheds the import cannot be quietly left in. Take the whole entry out the
      #     day an extension-host harness exists.
      #
      #   both lists            + .claude/hooks/**
      #     The Claude host adapter, which exists to run `git rev-parse` and then the pinned
      #     resolver — the developer's toolchain again, so S4036 fires for the same reason and can
      #     never be satisfied for the same reason. Same caveat as above: real defects there are no
      #     longer looked for either, and what guards it instead is
      #     `src_vs_code/src/test/claudeAdapter.test.mjs`, which runs the hook and asserts what it
      #     emits — including the case where the submodule is missing.
      #
      #
      #   sonar.issue.ignore  csharpsquid:S3453 in src_bugs/src/Program.cs — ONE FILE, one rule
      #     "This class can't be instantiated; make its constructor 'public'." It contradicts S1118
      #     on the same declaration, and the two cannot both be satisfied: every member of
      #     `CoaiBugs.Program` is static, so S1118 says do not offer a public constructor, while
      #     S3453 sees the private one and says the class is unusable. Making it `static` — which
      #     would satisfy both — is not available: `BugsServer : WebApplicationFactory<Program>`
      #     needs `Program` as a TYPE ARGUMENT, and a static class cannot be one. So the private
      #     constructor is the correct shape, the code says why at the declaration, and this is
      #     scoped to that single file rather than to the rule or the project. It took the PR's new
      #     reliability rating to C on its own (`new_reliability_rating` 3, gate wants 1).
      #
      #   sonar.issue.ignore  typescript:S1523 in src_vs_code/src/test/**
      #     "Dynamically executing code is security-sensitive", raised on `new Function`. In THIS
      #     repository that call is not a shortcut, it is the rule: `.agents/PROJECT.md` says a
      #     webview page is tested by RUNNING it, because a substring assertion over a page's text
      #     cannot see a control wired to the wrong branch, and running the page means executing
      #     the script the page itself generated. Fifteen test sites do it (bundledPage, chatPage,
      #     consultantSectionScript, rolesPageScript, rolesPageHarness); the input is a fixture the
      #     test wrote two lines earlier, and there is no user and no untrusted value anywhere in
      #     it. The rule stays ON for production code, which is where it means something. Noticed
      #     when extracting a shim into a new file made a moved line count as NEW code and took the
      #     quality gate to a security rating of D on a pure refactor.
      #   sonar.cpd.exclusions    + src_vs_code/src/help{Content,Ru,Uk,De,Es}.ts
      #     The help catalogue is five files holding the SAME 23 article ids, each with the same six
      #     fields, because a translation pass has to be a file reviewable on its own —
      #     `helpContent.ts` says so where `TRANSLATIONS` is declared, and the alternative it rejects
      #     is one literal nobody can edit without breaking a quote. To the copy-paste detector that
      #     parallel shape IS duplication: measured on main, `helpContent.ts` is 69.8 % duplicated
      #     and each translation carries ~185 duplicated lines.
      #     The whole project sits at 2.6 % and passes the overall gate, so this was invisible until
      #     somebody edited a translation: then those lines are NEW code, the duplicated block around
      #     them is counted with them, and the new-code gate reads 64 % against a limit of 3 %. It
      #     would fire on every future translation change and on no real defect — a number about the
      #     file layout rather than about the change, exactly like the coverage entry above.
      #     This stops CPD only; every rule, hotspot and coverage measure still applies to these
      #     files. Take it out the day the catalogue stops being one file per language.
      #     What guards the thing CPD cannot see here — a translation that has silently gone stale —
      #     is `helpCoverage.test.ts`, and only partly: it proves every article exists in every
      #     language, not that it still says what the English says. `todo/PLAN_a_stale_translation_is_invisible.md`
      #     is the open plan for that half.
      - name: Begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"remsoftdev_dew_flow_connect_other_ais" \
            /o:"remsoftdev" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage/*.xml"             /d:sonar.javascript.lcov.reportPaths="coverage/extension.lcov"             /d:sonar.typescript.lcov.reportPaths="coverage/extension.lcov" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,artifacts/**,**/node_modules/**,src_mcp/tests_fakecli/**,src_vs_code/scripts/**,.claude/hooks/**,.agents/conventions/**" \
            /d:sonar.cpd.exclusions="src_vs_code/src/helpContent.ts,src_vs_code/src/helpRu.ts,src_vs_code/src/helpUk.ts,src_vs_code/src/helpDe.ts,src_vs_code/src/helpEs.ts" \
            /d:sonar.issue.ignore.multicriteria="e1,e2" \
            /d:sonar.issue.ignore.multicriteria.e1.ruleKey="typescript:S1523" \
            /d:sonar.issue.ignore.multicriteria.e1.resourceKey="src_vs_code/src/test/**" \
            /d:sonar.issue.ignore.multicriteria.e2.ruleKey="csharpsquid:S3453" \
            /d:sonar.issue.ignore.multicriteria.e2.resourceKey="src_bugs/src/Program.cs" \
            /d:sonar.coverage.exclusions="**/tests/**,**/*.Tests/**,src_mcp/tests_fakecli/**,src_mcp/tests_notices/**,http/**,src_vs_code/scripts/**,.claude/hooks/**,.github/scripts/**,src_vs_code/src/bugsKeysPanel.ts,src_vs_code/src/bugzReviewPanel.ts,src_vs_code/src/callHierarchyVsCode.ts,src_vs_code/src/chatArchive.ts,src_vs_code/src/chatCapture.ts,src_vs_code/src/chatCommand.ts,src_vs_code/src/chatConfig.ts,src_vs_code/src/chatConversationRestore.ts,src_vs_code/src/chatFollow.ts,src_vs_code/src/chatGotoCommand.ts,src_vs_code/src/chatHooks.ts,src_vs_code/src/chatLaunch.ts,src_vs_code/src/chatPanel.ts,src_vs_code/src/chatPersist.ts,src_vs_code/src/chatPresetsPanel.ts,src_vs_code/src/chatRegistry.ts,src_vs_code/src/chatRestorePanel.ts,src_vs_code/src/chatRoots.ts,src_vs_code/src/chatSessionJoin.ts,src_vs_code/src/chatShow.ts,src_vs_code/src/chatTurn.ts,src_vs_code/src/claudeProbeCache.ts,src_vs_code/src/consultPromptFile.ts,src_vs_code/src/consultationWatcher.ts,src_vs_code/src/conversationPickerCommand.ts,src_vs_code/src/dataCommands.ts,src_vs_code/src/escalationWatcher.ts,src_vs_code/src/extension.ts,src_vs_code/src/helpPanel.ts,src_vs_code/src/installer.ts,src_vs_code/src/notificationsPanel.ts,src_vs_code/src/notify.ts,src_vs_code/src/panelProvider.ts,src_vs_code/src/phrasesPanel.ts,src_vs_code/src/reviewWrites.ts,src_vs_code/src/revisionOpen.ts,src_vs_code/src/roleDeletionsHost.ts,src_vs_code/src/rolesPanel.ts,src_vs_code/src/roundsLogCache.ts,src_vs_code/src/roundsLogPanel.ts,src_vs_code/src/settingWrite.ts,src_vs_code/src/sideConfig.ts,src_vs_code/src/snippetInWorkspace.ts,src_vs_code/src/test/**,src_vs_code/src/textToneHost.ts,src_vs_code/src/uiScaleHost.ts"
      - name: Build
        run: dotnet build dew_flow_connect_other_ais.slnx -c Release --no-incremental
      # The ingest suite runs the PREVIOUS release in one test and FAILS on CI when it is absent,
      # so this job needs the archive as much as `ci.yml` does.
      - name: Fetch the previous ingest server
        uses: ./.github/actions/fetch-old-bugs
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Test with coverage
        run: |
          mkdir -p coverage
          dotnet-coverage collect -f xml -o coverage/server.xml -- ./src_mcp/tests/bin/Release/net10.0/CoaiMcp.Tests
          dotnet-coverage collect -f xml -o coverage/bench.xml -- ./src_bench/CoaiBench.Tests/bin/Release/net10.0/CoaiBench.Tests
          # Every .NET test project this repository has must be collected here, or the projects it
          # covers arrive at the gate as 0 % coverage of new code and the gate fails for a reason
          # that is about the analysis rather than about the change. That is exactly what
          # `coai-server` did on the PR that introduced it: 37 passing tests, new_coverage 0.0.
          dotnet-coverage collect -f xml -o coverage/coai-server.xml -- ./src_server/tests/bin/Release/net10.0/CoaiServer.Tests
          # And `coai-bugs` proved the note above right a second time, on the pull request that
          # introduced IT: 29 passing tests over a whole new binary, and a gate that read 9.0 %
          # coverage of new code because nothing here ran them. The suite also covers the CLIENT's
          # send path — `BothHalvesTests` drives the real `UploadRun` against the real server — so
          # leaving it out understated `src_mcp` as well.
          dotnet-coverage collect -f xml -o coverage/coai-bugs.xml -- ./src_bugs/tests/bin/Release/net10.0/CoaiBugs.Tests
      # The extension is TypeScript and the .NET scanner does not run its tests, so every change to
      # src_vs_code arrived at the gate as 0 % coverage of new code — a number about the analysis
      # rather than about the change. Node's own runner writes lcov.
      - name: The extension's coverage
        working-directory: src_vs_code
        run: |
          # --ignore-scripts: SonarCloud githubactions:S6505 — a lifecycle script runs as CI with the
          # token in the environment. esbuild ships its binary as an optional platform dependency
          # rather than a postinstall download, so the bundler the tests use still works without them.
          npm ci --ignore-scripts
          npm run compile
          mkdir -p ../coverage
          # Through c8 rather than node's own --experimental-test-coverage: node writes the paths of
          # the files it EXECUTED, which are out/*.js, while Sonar analyses src/*.ts — so every
          # extension change arrived at the gate as 0 % coverage of new code even when it shipped
          # with tests. c8 reads the same V8 data and applies the source maps, so the report names
          # the TypeScript. (Measured 2026-09-05 on PR #10: SF:out\cliVersions.js against
          # SF:src\cliVersions.ts.)
          # The installed binary, never npx: npx resolves and runs a package on demand, which is a
          # supply-chain hole in CI with a token in the environment (SonarCloud githubactions:S6505,
          # S8543). c8 is a declared dev dependency, so npm ci has already put it here at the version
          # the lock file pins.
          ./node_modules/.bin/c8 --reporter=lcovonly --report-dir=../coverage/c8 --src=src node --test "out/test/"*.test.js
          # c8 writes them relative to THIS folder, with the platform's separators; Sonar wants them
          # relative to the repository root.
          sed -e 's|^SF:|SF:src_vs_code/|' -e 's|\\|/|g' ../coverage/c8/lcov.info > ../coverage/extension.lcov
      - name: End
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
