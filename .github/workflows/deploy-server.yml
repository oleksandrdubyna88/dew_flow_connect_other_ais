name: deploy the Team server

# Updates `coai.remsoft.dev` to a published `server-v*` release.
#
# What this workflow does NOT do is the point of it: it does not restart the unit, swap a symlink,
# keep a release trail or decide that a deployment is healthy. `deploy/systemd-release.sh` on the
# host owns all four, and it is far better at them than a workflow step would ever grow to be — an
# immutable version-addressed release directory, `bin` swapped by ONE rename syscall, a trail a
# second consecutive rollback still reads correctly, and a canary that runs one real review per
# configured vendor because `systemctl is-active` reported healthy every day the server ran
# without completing a single review.
#
# So this file's whole job is: check the request, put the PUBLISHED artefact on the host, run that
# script, and prove afterwards that the version answering the internet is the one that was asked
# for — rolling back through the same script when it is not.
#
# Dispatch rather than `on: release`: a deploy that fired itself on a tag would have restarted the
# live server in the middle of the load campaign that ran against it on 2026-09-08. Cutting a
# release and choosing to interrupt live reviews are the same person's decisions here, but they
# are not the same decision.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The published server version to deploy, e.g. 0.5.5'
        required: true
        type: string

permissions:
  contents: read

env:
  # The RID the host runs. A knob rather than a literal, because the other five exist and an arm64
  # box is a plausible move for this server; it is NOT an input, because the person dispatching a
  # deploy is choosing a version, not an architecture.
  HOST_RID: linux-x64

jobs:
  # Deliberately OUTSIDE the production environment: a typo must not spend somebody's approval, and
  # a version whose release failed halfway must be refused before anything touches the host.
  preflight:
    name: the request is answerable
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      asset: ${{ steps.check.outputs.asset }}
    steps:
      - id: check
        env:
          # Through the environment, never interpolated into the script. A `${{ }}` inside a `run:`
          # block is substituted BEFORE bash sees the text, so a version containing a quote and a
          # semicolon would become part of the command rather than an argument to it.
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The strict shape, because this value ends up as an argument to a command that runs as
          # root on the host. `0.5.5; systemctl disable coai-server` is an ordinary thing to type
          # into a text box, and an approval gate does not read what it approves.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "'$VERSION' is not a version — expected 0.5.5, or 0.5.5-rc.1"
            exit 1
          fi

          TAG="server-v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "there is no release $TAG — cut the tag first, and let the release workflow finish"
            exit 1
          fi

          # The archive for the RID the host actually runs. A release that built five of six
          # platforms is green from every angle except this one.
          ASSET="coai-server-$VERSION-$HOST_RID.tar.gz"
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
            echo "release $TAG carries no $ASSET — the host runs $HOST_RID and there is nothing to deploy"
            gh release view "$TAG" --json assets --jq '.assets[].name'
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "$TAG carries $ASSET"

  deploy:
    name: deploy to coai.remsoft.dev
    needs: preflight
    runs-on: ubuntu-latest
    # Generous, because the release script's canary runs one REAL review per configured vendor and
    # a slow reviewer legitimately takes minutes. Bounded all the same: an ssh session to a host
    # that stops answering mid-script would otherwise hold this job — and its approval — for the
    # six-hour default, with nothing on screen saying it is stuck.
    timeout-minutes: 40
    # Where the required reviewer and the deploy secrets both live. Without it, a workflow that can
    # reach the host from any branch is a workflow anyone with push access can point at the
    # company's paid subscriptions.
    environment: production
    steps:
      # Its own step, naming each one. A deploy whose secrets are missing must never be a green job
      # that did nothing — the entire point of this workflow is that somebody believes the server
      # was updated afterwards.
      - name: The secrets this needs
        env:
          COAI_DEPLOY_HOST: ${{ secrets.COAI_DEPLOY_HOST }}
          COAI_DEPLOY_USER: ${{ secrets.COAI_DEPLOY_USER }}
          COAI_DEPLOY_KEY: ${{ secrets.COAI_DEPLOY_KEY }}
          COAI_DEPLOY_KNOWN_HOSTS: ${{ secrets.COAI_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -uo pipefail
          MISSING=""
          for name in COAI_DEPLOY_HOST COAI_DEPLOY_USER COAI_DEPLOY_KEY COAI_DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || MISSING="$MISSING $name"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::this deploy cannot run:$MISSING is not set on the production environment"
            exit 1
          fi

      - name: The key and the host key
        env:
          COAI_DEPLOY_KEY: ${{ secrets.COAI_DEPLOY_KEY }}
          COAI_DEPLOY_KNOWN_HOSTS: ${{ secrets.COAI_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$COAI_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$COAI_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # There is NO `StrictHostKeyChecking=no` fallback anywhere in this file, because a fallback
      # is the vulnerability it would be protecting against: it hands a root key to whoever answers
      # on port 22. What this step adds instead is a sentence, because `Host key verification
      # failed` in the middle of a deploy sends an operator to retry a network problem they do not
      # have — the host was rebuilt, and the secret is what needs updating.
      - name: Reach the host, and say which failure it is when it cannot
        env:
          HOST: ${{ secrets.COAI_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.COAI_DEPLOY_USER }}
        shell: bash
        run: |
          set -uo pipefail
          OUT=$(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
                    -o ConnectTimeout=15 "$USER_NAME@$HOST" \
                    'test -x /opt/coai/src/deploy/systemd-release.sh && echo ok' 2>&1)
          STATUS=$?
          printf '%s\n' "$OUT"
          if [ "$STATUS" -ne 0 ]; then
            case "$OUT" in
              *"Host key verification failed"*|*"REMOTE HOST IDENTIFICATION HAS CHANGED"*)
                echo "::error::the host key does not match COAI_DEPLOY_KNOWN_HOSTS — if $HOST was rebuilt, update that secret; if it was not, do NOT deploy" ;;
              *"Permission denied"*)
                echo "::error::$USER_NAME@$HOST refused the deploy key — COAI_DEPLOY_KEY is not authorised there" ;;
              *"Connection timed out"*|*"Could not resolve"*|*"No route to host"*)
                echo "::error::$HOST is unreachable from this runner" ;;
              *)
                echo "::error::the release script is not executable at /opt/coai/src/deploy/systemd-release.sh" ;;
            esac
            exit 1
          fi

      # Downloaded, not rebuilt. Building on the host costs three minutes of a 3.8 GB box whose
      # unit carries `MemoryMax=1500M`, to produce a binary this repository already built, tested
      # and smoked for exactly this RID.
      - name: Take the published artefact, and check it is the one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          ASSET: ${{ needs.preflight.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern "$ASSET" --pattern "$ASSET.sha256" --dir .
          sha256sum -c "$ASSET.sha256"
          tar tzf "$ASSET" | head -20

      # Read BEFORE anything is swapped, because it is what makes the rollback decision safe: a
      # deploy that failed before the swap leaves a healthy server on this version, and rolling
      # THAT back would downgrade a server nobody had a complaint about.
      - name: What the server is serving now
        id: before
        env:
          PUBLIC_URL: ${{ vars.COAI_PUBLIC_URL || 'https://coai.remsoft.dev' }}
        shell: bash
        run: |
          set -uo pipefail
          NOW=$(curl -fsS --max-time 10 "$PUBLIC_URL/api/health" 2>/dev/null || true)
          echo "before: ${NOW:-<no answer>}"
          echo "health=$NOW" >> "$GITHUB_OUTPUT"

      - name: Put it on the host and run the release script
        id: install
        env:
          HOST: ${{ secrets.COAI_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.COAI_DEPLOY_USER }}
          VERSION: ${{ inputs.version }}
          ASSET: ${{ needs.preflight.outputs.asset }}
          # A PATH on the host, not a value: a token on a command line reaches `ps aux` and the
          # shell history of a root session. The file is the host operator's to place.
          TOKEN_FILE: ${{ vars.COAI_CANARY_TOKEN_FILE || '/etc/coai-canary.token' }}
        shell: bash
        run: |
          set -euo pipefail

          # ssh joins its command arguments back into ONE string and the remote shell re-parses it,
          # so an argv element is not the boundary it looks like. A repository variable reading
          # `/etc/x;touch /root/pwned` would therefore execute on the host, as the deploy account.
          # `$VERSION` was already pinned to a strict pattern in `preflight`; this is the other
          # value that crosses, and it gets the same treatment. Raised on the code round.
          if ! printf '%s' "$TOKEN_FILE" | grep -Eq '^/[A-Za-z0-9._/-]+$'; then
            echo "::error::COAI_CANARY_TOKEN_FILE is not a plain absolute path: '$TOKEN_FILE'"
            exit 1
          fi

          # The archive name is BUILT from a version that preflight already pinned, so it cannot
          # carry a metacharacter today. Asserted anyway, because that is a fact about a different
          # file: the day somebody derives this name from a release listing instead, the safety
          # would quietly move without anything here noticing. One line, checked at the boundary.
          if ! printf '%s' "$ASSET" | grep -Eq '^coai-server-[0-9A-Za-z.-]+\.tar\.gz$'; then
            echo "::error::refusing to send an archive name this shape: '$ASSET'"
            exit 1
          fi

          # NOT /tmp. The script runs as root and unpacks what it is given, and /tmp is
          # world-writable: anything else on that box can pre-create the name as a symlink and have
          # root extract through it. A directory under the deploy account's own home cannot be
          # raced by a user who is not already that account. Raised on the code round.
          STAGE=".coai-deploy"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$USER_NAME@$HOST" "mkdir -p ~/$STAGE && chmod 700 ~/$STAGE"
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$ASSET" "$USER_NAME@$HOST:$STAGE/$ASSET"

          # What is live BEFORE the swap, in the job log. The script keeps a release trail and can
          # print it, and printing it costs one ssh round trip: an operator reading a failed deploy
          # afterwards should not have to log in to find out what it replaced.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$USER_NAME@$HOST" '/opt/coai/src/deploy/systemd-release.sh --list' || true

          # One remote command, no inline script. The unpacking that would otherwise live in a
          # heredoc here belongs to `--from`, which takes the archive itself — a shell fragment
          # embedded in a workflow is the copy of the release procedure nobody would ever test.
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
              "$USER_NAME@$HOST" \
              env "COAI_TOKEN_FILE=$TOKEN_FILE" \
              /opt/coai/src/deploy/systemd-release.sh --from "\$HOME/$STAGE/$ASSET" "$VERSION"

      # `always()`, and that is the fix for a real window: an ssh session that dies AFTER the script
      # swapped `bin` fails this job with the new release live and unverified, and a verification
      # that only runs on success would never look. It runs whenever the install was ATTEMPTED.
      #
      # Loopback first, so a failure separates "the unit is wrong" from "the edge is wrong" instead
      # of blaming whichever end happened to be checked. Retried, because nginx and the unit do not
      # come back in the same millisecond and a single curl after a restart measures the restart.
      - name: The version serving the internet is the one that was asked for
        id: verify
        if: always() && steps.install.outcome != 'skipped'
        env:
          HOST: ${{ secrets.COAI_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.COAI_DEPLOY_USER }}
          VERSION: ${{ inputs.version }}
          BEFORE: ${{ steps.before.outputs.health }}
          PUBLIC_URL: ${{ vars.COAI_PUBLIC_URL || 'https://coai.remsoft.dev' }}
        shell: bash
        run: |
          set -uo pipefail
          SSH="ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15"

          # PARSED, not grepped. `"version":"0.5.5"` is what this serializer emits today; one
          # whitespace change in a future System.Text.Json would make every healthy deploy read as
          # broken and trigger a rollback nobody needed. jq is on the runner, so both bodies are
          # judged here rather than on the host. (gemini, code round.)
          serves() { printf '%s' "$1" | jq -e --arg v "$VERSION" '.version == $v' >/dev/null 2>&1; }

          LOCAL=$($SSH "$USER_NAME@$HOST" 'curl -fsS --max-time 5 http://127.0.0.1:8090/api/health' 2>&1 || true)
          echo "loopback: ${LOCAL:-<no answer>}"
          if ! serves "$LOCAL"; then
            echo "the unit itself is not serving $VERSION — the edge is not the problem"
          fi

          # `no-cache`: a proxy that answered this endpoint a minute ago could hand back the
          # PREVIOUS version's body and make a failed deploy read as an old one, or the reverse.
          PUBLIC=""
          for attempt in $(seq 1 30); do
            PUBLIC=$(curl -fsS --max-time 5 -H 'Cache-Control: no-cache' "$PUBLIC_URL/api/health" 2>/dev/null || true)
            serves "$PUBLIC" && break
            echo "  attempt $attempt: ${PUBLIC:-<no answer>}"
            sleep 2
          done
          echo "public: ${PUBLIC:-<no answer>}"

          if serves "$PUBLIC"; then
            echo "state=ok" >> "$GITHUB_OUTPUT"
            echo "$PUBLIC_URL is serving $VERSION"
            exit 0
          fi

          # The distinction the rollback depends on. Still serving what it served before the swap
          # means the swap did not happen: the live release is the one that was running this
          # morning, and popping the trail would take a healthy server BACK a version for a deploy
          # that never landed.
          if [ -n "$BEFORE" ] && [ "$PUBLIC" = "$BEFORE" ]; then
            echo "state=unchanged" >> "$GITHUB_OUTPUT"
            echo "::error::the deploy did not take effect — $PUBLIC_URL still reports what it did before it ran. Nothing was rolled back, because nothing changed."
            exit 1
          fi

          echo "state=broken" >> "$GITHUB_OUTPUT"
          echo "::error::$PUBLIC_URL reports '${PUBLIC:-<no answer>}' after deploying $VERSION"
          exit 1

      # The window this closes: the script swaps `bin` and canaries behind it, and everything after
      # that used to be a red job over a live server still running the new release. `--rollback`
      # pops the trail — it BUILDS nothing and takes seconds — and the summary says it ran, because
      # a rollback nobody is told about is a second incident.
      #
      # `broken` only. A deploy that never took effect leaves the previous release serving, and
      # rolling that back would undo a deployment nobody asked about to fix one that never happened.
      - name: Roll back, because the deploy did not prove itself
        if: always() && steps.verify.outputs.state == 'broken'
        env:
          HOST: ${{ secrets.COAI_DEPLOY_HOST }}
          USER_NAME: ${{ secrets.COAI_DEPLOY_USER }}
        shell: bash
        run: |
          set -uo pipefail
          OUT=$(ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 \
                    "$USER_NAME@$HOST" '/opt/coai/src/deploy/systemd-release.sh --rollback' 2>&1)
          STATUS=$?
          printf '%s\n' "$OUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "### The deploy was rolled back" >> "$GITHUB_STEP_SUMMARY"
            echo "The new release did not answer with its own version, so the previous deployment was restored." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::the rollback ALSO failed — the server may be down; read /opt/coai/logs and run systemd-release.sh --list on the host"
            echo "### The rollback failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '%s\n' "$OUT" >> "$GITHUB_STEP_SUMMARY"
