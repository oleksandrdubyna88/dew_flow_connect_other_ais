    <header class="head">
      <h1>Settings</h1>
      <div class="head-controls">

    <nav class="tabs" role="tablist" aria-label="Settings" id="tabs"></nav>
    <div id="subtabs-host"></div>

  <dialog id="add-dialog" aria-labelledby="add-title"></dialog>

  <template id="notes-template">
    <div class="notes-page">
      <p class="lead">What this mockup proposes, and why. Investigated on <code>origin/main</code> 8c773ab9
        (extension 0.62.1, coai-mcp 0.42.1), 2026-10-04; the Security tab it follows shipped as coai-mcp 0.43.0 the same day. Only the Settings page is redesigned — the
        sidebar and the Review rounds page are not touched.</p>

      <h2>1. The problem: a model is chosen in seven places, in seven shapes</h2>
      <table class="map">
        <thead><tr><th scope="col">Feature</th><th scope="col">Today it picks its model in</th><th scope="col">Shape</th></tr></thead>
        <tbody>
          <tr><td>Reviewers</td><td><code>coai.vendors</code> rows</td><td>a list (<code>claude-2</code>…), stage boxes</td></tr>
          <tr><td>Consultant</td><td><code>coai.consultants</code></td><td>one slot per caller, its own vendor/model/endpoint/CLI path</td></tr>
          <tr><td>Question consultant</td><td><code>qconsultRows</code></td><td>a list, one prompt per row, its own key field</td></tr>
          <tr><td>Security lane</td><td><code>securityLane.runs[].vendor</code></td><td>borrows reviewer row ids</td></tr>
          <tr><td>Chat</td><td><code>chatModelPresets</code></td><td>a list, not per side, its own add wizard</td></tr>
          <tr><td>Bugz</td><td><code>bugzModel</code></td><td>one string <code>rowId/model</code>, matched on the id <code>local</code></td></tr>
          <tr><td>Split orders</td><td><code>commandModels</code></td><td>the caller's OWN models — stays outside the catalog</td></tr>
        </tbody>
      </table>
      <p>Four allowed-runtime lists, three different add flows, two capability rule sets, and effort exists only on
        API rows. A key is shared with a reviewer row "by name" (the Consultant tab's footnote), which nobody can see.</p>

      <h2>2. The principles of the new page</h2>
      <ul>
        <li><b>One catalog.</b> A model is added, duplicated and removed only on <b>Models</b>. Every other tab
          picks from the instances ticked for it — never from a vendor list of its own.</li>
        <li><b>An instance, not a vendor.</b> The same vendor and model can be added many times. A different
          effort, system prompt or key is a different instance (GLM 5.3 · low for reviews, GLM 5.3 · high for
          the consultant).</li>
        <li><b>Ticks say what it is used for.</b> Plan, code, document and feature review, the security lane,
          the consultant, the question consultant, chat and Bugz.</li>
        <li><b>The access badge is measured, not guessed.</b> CLI (reads this machine), API key, local engine
          or Team server, from <code>shared/runtime-capabilities.json</code>. A key does not mean "no files":
          DeepSeek through the Codex CLI has a shell.</li>
        <li><b>Explain, do not block.</b> What a runtime cannot do is greyed out with its reason; what it can
          do with limits is allowed and marked <span style="color:var(--warn)">*</span>. A consultant of the
          caller's own vendor is shown as an overlap, never refused.</li>
        <li><b>Two columns on a wide screen</b> (from 1100 px), one on a narrow one — and <b>blocks side by side
          are one height</b>: cards are rows of one shared grid (subgrid), so their sections line up too.</li>
        <li><b>Every page has text size and brightness</b> in its header (🔍 and ☀), as every ConnectOtherAIs
          webview must.</li>
        <li><b>Three filter rows</b> on Models: what it is used for, its effort, its vendor. They combine.</li>
        <li><b>"new" lasts a week.</b> The extension records when this install first ran the version that brought
          a control, and drops the tag 7 days later.</li>
        <li><b>Colour is never the only signal</b>: every badge and state also says it in words.</li>
      </ul>

      <h2>3. Twelve tabs become six</h2>
      <table class="map">
        <thead><tr><th scope="col">New tab</th><th scope="col">Sub-tabs</th><th scope="col">Takes over from today's</th></tr></thead>
        <tbody>
          <tr><td>Models</td><td>—</td><td>the model half of Reviewers, Consultant, Question consultant, Chat presets, Bugz; the vendor keys a model uses</td></tr>
          <tr><td>Reviews</td><td>Stages &amp; roles · Prompts per round · The gate · Limits</td><td>Prompts per round, The gate, Limits, the stage boxes</td></tr>
          <tr><td>Consultants</td><td>Consultant · Question consultant</td><td>Consultant, Question consultant (their budgets, prompts, cadence)</td></tr>
          <tr><td>Security lane</td><td>—</td><td>Security lane (its pairs pick instances ticked "Security lane")</td></tr>
          <tr><td>Chat</td><td>—</td><td>Chat other AIs and the Chat presets editor's prompt half</td></tr>
          <tr><td>Setup</td><td>Vendor keys · Team servers · MCP server · This side</td><td>Vendor keys, Team servers, MCP server, This side — plus what hid in
            the sidebar's ⋯ menu: the config block per AI client, the gate instructions, Export / Import settings</td></tr>
        </tbody>
      </table>

      <h2>4. What one instance carries</h2>
      <p>A stable id (it keys the vault, the spending ledger, the round history and the colour), a display
        name, the vendor and model, enabled, the features it is ticked for, effort (and thinking where the
        vendor has it), a system prompt (Default = empty), and its connection: CLI path, endpoint, vault key
        name, dialect, Team server, price and timeout. A new instance gets the next free id —
        <code>claude</code>, <code>claude-2</code> — exactly as reviewer rows do today, so history stays attached.</p>

      <h2>5. Effort, per vendor</h2>
      <table class="map">
        <thead><tr><th scope="col">Vendor</th><th scope="col">Levels</th><th scope="col">Today</th></tr></thead>
        <tbody>
          <tr><td>Claude Code</td><td>low · medium · high · max</td><td><span class="tag-new">new</span> not passed by the adapter</td></tr>
          <tr><td>Codex CLI, DeepSeek/OpenRouter via Codex</td><td>minimal · low · medium · high · xhigh</td><td><span class="tag-new">new</span> <code>model_reasoning_effort</code> never passed</td></tr>
          <tr><td>Team server</td><td>the server vendor's levels</td><td><span class="tag-new">new</span> no field in the review request</td></tr>
          <tr><td>Alibaba Model Studio</td><td>GLM low · high · max; Qwen none · low · medium · xhigh (+ thinking)</td><td>exists (API rows)</td></tr>
          <tr><td>xAI</td><td>low · medium · high · xhigh</td><td>exists (API rows)</td></tr>
          <tr><td>Local engine</td><td>none · low · medium · high</td><td>one global value, now per instance</td></tr>
          <tr><td>Antigravity</td><td>part of the model name</td><td>unchanged by decision</td></tr>
        </tbody>
      </table>
      <p>The consultant, the question consultant and chat get effort through the instance they use — there is
        no second effort control on their tabs.</p>

      <h2>6. Defects found while investigating (all still true on 8c773ab9)</h2>
      <ol>
        <li>Adding/removing a reviewer, adding/removing a Team server, a round's prompt pick and the Bugz
          server write the shared settings even when "separate settings per side" is on — the new reviewer does
          not appear on this side, the prompt pick snaps back. <i>Separate fix plan.</i></li>
        <li>In "Full" code mode, API and local reviewers are told they hold a read-only checkout they cannot
          read (<code>ReviewerPrompt.cs:89</code>). <i>Separate fix plan.</i></li>
        <li>The consultant picker offers DeepSeek, OpenRouter and a custom endpoint, which the server then refuses.</li>
        <li>The Antigravity model list offers Claude models, against the vendor-routing rule.</li>
        <li><code>local-2</code> never reaches the Bugz picker; <code>claude-2</code> loses Claude's colour (lists keyed by row id).</li>
        <li>The chat wizard's "Another OpenAI-compatible endpoint" never asks for a URL — it silently becomes Codex.</li>
        <li>"Vendor keys" ignores keys used by the consultant, the question consultant and chat.</li>
        <li>A Team server vendor cannot be added twice.</li>
        <li>The "Gemini" caller is the retired Gemini CLI in split orders and Antigravity in the consultant.</li>
        <li>xAI gets the <code>xai</code> dialect as a preset and <code>openai</code> through a vault key.</li>
      </ol>
      <p>3–10 disappear by construction with one catalog and one set of availability rules.</p>

      <h2>7. Nothing of today is lost — audited 2026-10-04</h2>
      <p>Two independent audits walked all 60 <code>coai.*</code> settings, all 49 panel commands, every control on the 12
        current tabs, the Review roles, Chat presets and Gate commands pages, and the unmerged Security tab. Every one is
        now on this page, moved here from the sidebar's ⋯ menu, or replaced on purpose:</p>
      <ul>
        <li><b>Replaced on purpose:</b> every per-feature vendor/model/endpoint/CLI-path/key picker → the Models catalog;
          the two role switches → one; the Chat presets and Review roles pages → Chat and Reviews › Roles &amp; prompts;
          editing a security prompt in a separate editor → in place on its card.</li>
        <li><b>Kept as they are today:</b> the CLI's ▶ open / ⤓ install / ⟳ update, coai-mcp's own "cannot run" verdict, where a
          model list came from and how to ask again, the API module's calibrated defaults and "runs it at", thinking that cannot
          be switched off, local-engine re-probe and the WSL fix, the off-machine endpoint warning, the last-model rule, every
          "server too old" note (try <i>coai-mcp here</i> in the top bar), stranded choices shown with their reason, the paid
          Check's confirmation, the other side's read-only health, agy's allow rule, role deletion's confirmation, a role kept off
          until it has a question, the data folder's real Change and Move flows, and a "?" on the controls.</li>
        <li><b>Out of this page by decision:</b> the sidebar (Notifications, Active rounds, Phrases, Bugz actions) and the Review
          rounds page with its spending view. Bugz's ranking MODEL moves here (one model, ticked on Models); its actions stay in
          the sidebar.</li>
      </ul>

      <h2>8. New capabilities — what has to change behind the page</h2>
      <table class="map">
        <thead><tr><th scope="col">On this page</th><th scope="col">Extension</th><th scope="col">coai-mcp</th><th scope="col">Settings wire</th><th scope="col">Team server</th></tr></thead>
        <tbody>
          <tr><td>The models catalog (replaces vendors, consultants, question-consultant rows, chat model presets, the Bugz model, security pairs' reviewers)</td><td>✓ migration that keeps ids</td><td>reads the catalog</td><td>✓ a version gate both ways</td><td>—</td></tr>
          <tr><td>Effort for Claude Code, Codex (and DeepSeek / OpenRouter through it)</td><td>✓</td><td>the claude and codex runners pass it</td><td>✓</td><td>—</td></tr>
          <tr><td>Effort on a Team-server model</td><td>✓</td><td>the remote runner</td><td>✓</td><td>the review request and its runners</td></tr>
          <tr><td>Local effort per model (today one global value)</td><td>✓</td><td>LocalAsk</td><td>✓</td><td>—</td></tr>
          <tr><td>A system prompt per model</td><td>✓ (chat runs in the extension)</td><td>every runner</td><td>✓</td><td>a request field</td></tr>
          <tr><td>A time limit per model for every runtime (today API rows only)</td><td>✓</td><td>the scheduler</td><td>✓</td><td>✓</td></tr>
          <tr><td>A consultant on an API key, or the Codex CLI with an endpoint</td><td>✓</td><td>an API consult runner, multi-turn</td><td>✓</td><td>—</td></tr>
          <tr><td>Editable signal words; a check's own words or /regex/</td><td>✓</td><td>SecuritySignals from settings; a bounded regex matcher</td><td>✓</td><td>—</td></tr>
          <tr><td>"Try it" for security triggers</td><td>✓</td><td>ideally a probe mode, so the page and the server cannot disagree</td><td>—</td><td>—</td></tr>
          <tr><td>✓ Check on any model (today only the consultant has one)</td><td>✓</td><td>a probe mode per runtime</td><td>—</td><td>✓ for remote</td></tr>
          <tr><td>One switch per role</td><td>✓</td><td>—</td><td>migrate roleEnabled + active</td><td>—</td></tr>
          <tr><td>Gate commands, Roles &amp; prompts and Chat presets inline on Settings</td><td>✓</td><td>—</td><td>—</td><td>—</td></tr>
          <tr><td>Per-client registration status and a Codex TOML block</td><td>✓ (reads other programs' config: a new stance)</td><td>—</td><td>—</td><td>—</td></tr>
          <tr><td>Chat models become per side (they were shared)</td><td>✓</td><td>—</td><td>the per-side overlay list</td><td>—</td></tr>
        </tbody>
      </table>

      <h2>9. Found on the way</h2>
      <ul>
        <li><b>No check runs on <code>crypto</code>.</b> coai-mcp detects the signal, but none of the 12 shipped presets is triggered by it —
          a change touching encryption or randomness starts no dedicated check (the routing table shows "nothing runs on it").</li>
        <li><b>Today's MCP server tab says settings apply "when your MCP client next starts it"</b> (<code>panelView.ts:1848</code>).
          That stopped being true when <code>PanelServiceHost</code> began rebuilding on every settings-file change.</li>
        <li><b>Export writes the shared settings only:</b> with separate settings per side, a side's own models are not in the file.</li>
      </ul>

      <h2>10. Decided on 2026-10-04, and still open</h2>
      <ul>
        <li>Decided: one catalog for every feature; effort for every vendor except Antigravity; a system prompt
          per instance (Default, empty); a key per instance; overlap is shown, never blocked; six tabs with
          sub-tabs under Reviews, Consultants and Setup; only the Settings page changes.</li>
        <li>Decided: this mockup is reviewed and debugged first, then the plan, then development; coai-mcp's wire
          changes once the UI is accepted.</li>
        <li>Open: how existing settings move into the catalog (a one-time migration that keeps the ids is the
          recommendation); per-role ticks (not in this mockup); the Security tab plan on
          <code>feat/security-tab-e1</code> lands its own redesign first.</li>
      </ul>
